name: F03 exact existing r26 review derivation
run-name: F03 existing review ${{ fromJSON(inputs.request).intent }}
on:
  workflow_dispatch:
    inputs:
      runtime_commit:
        description: Qualified immutable recovery runtime commit
        required: true
      request:
        description: Exact protected input commit/prefix/manifest and selected r26 master
        required: true
permissions:
  contents: read
concurrency:
  group: f03-existing-r26-review
  cancel-in-progress: false
jobs:
  derive:
    if: github.repository == 'agmmltd-arch/agmm-render-public' && github.run_attempt == 1 && github.sha == inputs.runtime_commit && github.ref == format('refs/tags/agmm-f03-review-runtime-{0}', inputs.runtime_commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate immutable request before protected input checkout
        id: binding
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          inputs=json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert os.environ['GITHUB_SHA']==inputs['runtime_commit']
          assert os.environ['GITHUB_REF']=='refs/tags/agmm-f03-review-runtime-'+inputs['runtime_commit']
          request=inputs['request']
          Path('review-request.json').write_text(request if isinstance(request,str) else json.dumps(request))
          PY
          python3 .github/scripts/derive_f03_existing_review.py --request review-request.json --preflight
      - name: Read only the exact protected input commit and namespace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ steps.binding.outputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: protected-input
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.binding.outputs.private_prefix }}
      - name: Install original film QA encoder runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: Install the original gate import dependency
        run: python3 -m pip install --disable-pip-version-check numpy==2.0.2
      - name: Derive and verify through original assembly owner
        run: |
          python3 .github/scripts/derive_f03_existing_review.py --request review-request.json \
            --private-root protected-input --work "$RUNNER_TEMP/f03-existing-master" \
            --output "$RUNNER_TEMP/f03-existing-review"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ fromJSON(inputs.request).intent }}-REVIEW-1080
          path: ${{ runner.temp }}/f03-existing-review/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
