name: AGMM music supervisor
run-name: AGMM music ${{ inputs.label }}
# Hail Mary music supervision (27 Oct 2026): demucs the 8 reference reels (story half), CLAP-embed their non-vocal stems,
# download the Openverse CC0/PDM candidates listed in the private commit, score them (CLAP audio-to-audio, text mood, tempo,
# vocal probability, noise floor, clipping, loopability), export the winners as mp3. Media only from the PRIVATE repo / Openverse; nothing decodes on the Mac.
on:
  workflow_dispatch:
    inputs:
      private_commit: { description: 40-hex commit of agmm-video-render holding hailmary/music and hailmary/soundref, required: true }
      label: { description: short label, required: true }
      script: { description: script name inside hailmary/music, required: false, default: music_score.py }
permissions:
  contents: read
concurrency:
  group: agmm-music-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  score:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            hailmary/soundref
            hailmary/music
      - name: Runtime (static ffmpeg, no apt)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - name: Python deps
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet --retries 4 "numpy<2" scipy soundfile pyloudnorm "librosa==0.10.2.post1"
          pip install --quiet --retries 4 torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet --retries 4 demucs==4.0.1 "transformers==4.46.3" "numpy<2"
          python -c "import torch,demucs,transformers,librosa;print(torch.__version__,transformers.__version__,librosa.__version__)"
      - name: Score
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/venv/bin/activate"
          mkdir -p out
          python private/hailmary/music/${{ inputs.script }} out private/hailmary/soundref private/hailmary/music 2>&1 | grep -v -i warning | tee out/log.txt | tail -250
          ls -la out out/export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: music-${{ inputs.label }}
          path: out
          retention-days: 7
