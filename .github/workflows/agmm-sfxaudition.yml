name: AGMM sfxaudition
run-name: AGMM sfxaudition ${{ inputs.label }}
# Machine audition of candidate sounds (26 Oct 2026): CLAP similarity to role text and to noise/speech/vocal negatives, noise floor, onset, clipping, BPM.
on:
  workflow_dispatch:
    inputs:
      private_commit: { description: 40-hex commit of agmm-video-render holding hailmary/sfxaudition, required: true }
      label: { description: short label, required: true }
permissions:
  contents: read
jobs:
  audition:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            hailmary/sfxaudition
      - name: Runtime (static ffmpeg, no apt)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - name: Python deps
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"; . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet --retries 4 "numpy<2" scipy soundfile "librosa==0.10.2.post1"
          pip install --quiet --retries 4 torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet --retries 4 "transformers==4.46.3" "numpy<2"
      - name: Audition
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/venv/bin/activate"
          cd private/hailmary/sfxaudition
          python audition.py 2>&1 | grep -v -i warning | tail -150
          cp -r out "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sfxaudition-${{ inputs.label }}
          path: out
          retention-days: 7
