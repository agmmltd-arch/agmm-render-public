name: Synthetic Qwen25 7B audio research
run-name: Synthetic Qwen25 7B audio research 20261031
on: workflow_dispatch
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare CPU runtime and synthetic test inputs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg cmake libcurl4-openssl-dev
          git clone -q https://github.com/ggml-org/llama.cpp.git llama-src
          cd llama-src
          git checkout --detach 8642541b255bfb5dc39cd351a178be09013a55d6
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build -j 4 --target llama-app
          curl -fL --retry 2 -o model.gguf https://huggingface.co/unsloth/Qwen2.5-Omni-7B-GGUF/resolve/de13a229d14d23c7149d6550e99ed3fe7778b733/Qwen2.5-Omni-7B-Q4_K_M.gguf
          curl -fL --retry 2 -o mmproj.gguf https://huggingface.co/unsloth/Qwen2.5-Omni-7B-GGUF/resolve/de13a229d14d23c7149d6550e99ed3fe7778b733/mmproj-F16.gguf
          echo '2fdcb8b6952eeb79beeaf2294651d46ae039d579c88cf7e702a0ef05f766f6a4  model.gguf' | sha256sum -c -
          echo 'a2de3b1d6d4f72c9f86782fbeb95d206370342797c4fcffb30d132a7e6f209d3  mmproj.gguf' | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/.github/scripts/qwen25-synthetic-audio-panel.py"
          cp research-results.json "$RUNNER_TEMP/research-results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen25-synthetic-audio-research-text-only
          path: ${{ runner.temp }}/research-results.json
          if-no-files-found: warn
          retention-days: 7
