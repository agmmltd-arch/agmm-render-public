name: voicefree reference prep
run-name: voicefree ref ${{ inputs.label }}
# p01 (voice-free 20 Oct 2026): cut clean single-speaker segments of Sam's own voice from his TikTok audio. CPU only, no provider calls, no credentials
# beyond the existing read-only deploy key for the PRIVATE repo. The output is encrypted (AES-256, key = repo secret VOICEFREE_PASS) before it becomes an
# artifact, because this repo is public. Nothing audio is ever committed here (kit/tools/public_repo_guard.py).
on:
  workflow_dispatch:
    inputs:
      private_commit:
        description: 40-hex commit of agmm-video-render holding voice-free/ref-src and voice-free/ref/hashlocked
        required: true
      label:
        description: short label
        default: ref1
        required: true
      segments:
        description: how many segments to keep
        default: '6'
        required: true
permissions:
  contents: read
concurrency:
  group: voicefree-ref-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  ref:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/scripts/voicefree
      - name: Fetch Sam's private reference sources (read-only deploy key)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            voice-free/ref-src
            voice-free/ref/hashlocked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Cache pip and Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
          key: voicefree-ref-${{ runner.os }}-v2
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy soundfile librosa==0.11.0 faster-whisper==1.2.1 webrtcvad-wheels demucs==4.0.1
          python -m pip install --no-deps resemblyzer==0.1.4
      - name: Cut, screen and transcribe segments
        run: |
          python .github/scripts/voicefree/ref_prep.py --src private/voice-free/ref-src \
            --locked private/voice-free/ref/hashlocked/sam-reference-20260905T152059Z-cdf499.wav \
            --out "$RUNNER_TEMP/ref-out" --n "${{ inputs.segments }}"
      - name: Encrypt (public repo)
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/scripts/voicefree")
          import vf_common as C
          print("encrypted bytes", C.pack_encrypt(os.environ["RUNNER_TEMP"] + "/ref-out", os.environ["RUNNER_TEMP"] + "/ref-pack.enc"))
          PY
      - name: Upload encrypted pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voicefree-ref-${{ inputs.label }}-ENC
          path: ${{ runner.temp }}/ref-pack.enc
          retention-days: 7
          if-no-files-found: error
