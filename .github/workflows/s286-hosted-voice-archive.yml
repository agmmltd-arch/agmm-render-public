name: Preserve S286 checked voice on Ubuntu
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e40a4311d1e72ae24f67defe3ba3464d17526715
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: 394479fc139e11964be79bd5b54fd13b03738981
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-pointer
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: timing-proof/S286-e77898d522b81a87ce5e7231ab39ccde23876a149f2af9499aecb1ca27d28d0f/pointer.json
      - name: Verify exact pointer and preserve encrypted hosted voice
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
          AGMM_VOICE_ARCHIVE_DEPLOY_KEY: ${{ secrets.AGMM_VOICE_ARCHIVE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e40a4311d1e72ae24f67defe3ba3464d17526715
          test "$(git -C private-pointer rev-parse HEAD)" = 394479fc139e11964be79bd5b54fd13b03738981
          test "$(git -C private-pointer rev-parse HEAD:timing-proof/S286-e77898d522b81a87ce5e7231ab39ccde23876a149f2af9499aecb1ca27d28d0f/pointer.json)" = cf63b9c046ff0f6fc127492835a23fe8d8c1e642
          echo "e77898d522b81a87ce5e7231ab39ccde23876a149f2af9499aecb1ca27d28d0f  private-pointer/timing-proof/S286-e77898d522b81a87ce5e7231ab39ccde23876a149f2af9499aecb1ca27d28d0f/pointer.json" | sha256sum -c >/dev/null
          python3 .github/scripts/hosted_archive_voice.py private-pointer/timing-proof/S286-e77898d522b81a87ce5e7231ab39ccde23876a149f2af9499aecb1ca27d28d0f/pointer.json "$RUNNER_TEMP/archive-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S286-voice-archive-receipt
          path: ${{ runner.temp }}/archive-receipt.json
          retention-days: 30
          if-no-files-found: error
