name: S305 protected timing proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 646e6f9ef0143b10ff0b70d310f47a1c0f660cda
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: 4c3997f35128694111bd47be5dcfaa7f20f5f167
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-pointer
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: timing-proof/S305-ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98/pointer.json
      - name: Verify protected pointer and export timing on Ubuntu
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 646e6f9ef0143b10ff0b70d310f47a1c0f660cda
          test "$(git -C private-pointer rev-parse HEAD)" = 4c3997f35128694111bd47be5dcfaa7f20f5f167
          test "$(git -C private-pointer rev-parse HEAD:timing-proof/S305-ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98/pointer.json)" = 6dfddf403b679fd71895389f92143ea9469b9572
          echo "ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98  private-pointer/timing-proof/S305-ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98/pointer.json" | sha256sum -c >/dev/null
          python3 .github/scripts/timing-proof/export_voice_timing_encrypted_candidate.py private-pointer/timing-proof/S305-ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98/pointer.json "$RUNNER_TEMP/timing"
          tar -C "$RUNNER_TEMP/timing" -cf "$RUNNER_TEMP/timing.tar" .
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:VOICEFREE_PASS -in "$RUNNER_TEMP/timing.tar" -out "$RUNNER_TEMP/timing.enc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S305-timing-proof-ENC
          path: ${{ runner.temp }}/timing.enc
          retention-days: 7
          if-no-files-found: error
