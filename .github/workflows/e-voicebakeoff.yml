name: e voicebakeoff
run-name: e voicebakeoff ${{ inputs.engines }}
# E (Alfred the colleague) voice bake-off, 10 Nov 2026. Synthesizes 20 neutral test lines (no names, no business data) with free local models on a CPU
# runner. One engine at a time (max-parallel 1). Clips are uploaded for 1 day only. No paid service, no secrets.
on:
  workflow_dispatch:
    inputs:
      engines:
        description: comma list from kokoro,piper,chatterbox,chatterbox-ukref,f5,kyutai
        default: kokoro,piper
        required: true
permissions:
  contents: read
concurrency:
  group: e-voicebakeoff
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          e = [x.strip() for x in "${{ inputs.engines }}".split(",") if x.strip()]
          print("matrix=" + json.dumps({"engine": e}))
          PY
  synth:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/scripts/e-voicebakeoff
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 espeak-ng git
          python -m pip install --upgrade pip numpy soundfile
          case "${{ matrix.engine }}" in
            kokoro) python -m pip install kokoro-onnx ;;
            piper) python -m pip install piper-tts ;;
            chatterbox|chatterbox-ukref) python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu; python -m pip install chatterbox-tts==0.1.7 piper-tts ;;
            f5) python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu; python -m pip install f5-tts kokoro-onnx ;;
            kyutai) python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu; python -m pip install moshi sphn huggingface_hub ;;
          esac
      - name: Synthesize
        run: python .github/scripts/e-voicebakeoff/synth_e.py "${{ matrix.engine }}" "$RUNNER_TEMP/out"
      - name: Runner info
        if: always()
        run: nproc; lscpu | grep -m1 "Model name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e-voicebakeoff-${{ matrix.engine }}
          path: ${{ runner.temp }}/out
          retention-days: 1
