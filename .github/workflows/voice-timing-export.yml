name: AGMM verified voice timing export
run-name: Voice timing export ${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      pointer_b64:
        description: Base64 encoded existing sealed-voice pointer
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      POINTER_B64: ${{ inputs.pointer_b64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original hosted voice and export timing only
        run: |
          set -euo pipefail
          printf '%s' "$POINTER_B64" | base64 -d > "$RUNNER_TEMP/pointer.json"
          python3 .github/scripts/export_voice_timing.py "$RUNNER_TEMP/pointer.json" "$RUNNER_TEMP/timing-output"
      - name: Encrypt timing metadata before artifact upload
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, '.github/scripts/voicefree')
          import vf_common
          vf_common.pack_encrypt(os.environ['RUNNER_TEMP'] + '/timing-output', os.environ['RUNNER_TEMP'] + '/timing.enc')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-voice-timing-${{ github.run_id }}-ENC
          path: ${{ runner.temp }}/timing.enc
          retention-days: 7
          if-no-files-found: error
