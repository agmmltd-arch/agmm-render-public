name: Encrypted timing synthetic proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 646e6f9ef0143b10ff0b70d310f47a1c0f660cda
          persist-credentials: false
      - run: python3 -m unittest -v test_export_voice_timing_encrypted_candidate
        working-directory: .github/scripts/timing-proof
