name: F06 Wave05 durable development preview export
run-name: F06 Wave05 preview export of pinned run 37212158991

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: f06-wave05-development-preview-export
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'agmmltd-arch/agmm-render-public' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exporter candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Initialize hosted paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          echo "root=$RUNNER_TEMP/f06-preview-export" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/f06-preview-export"
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test exporter without media inputs
        working-directory: durable-export-candidate
        run: python -m unittest discover -s tests -v
      - name: Bind exact native run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/agmmltd-arch/agmm-render-public > "$RUNNER_TEMP/repository.json"
          gh api repos/agmmltd-arch/agmm-render-public/actions/runs/37212158991 > "$RUNNER_TEMP/run.json"
          gh api repos/agmmltd-arch/agmm-render-public/actions/runs/37212158991/jobs > "$RUNNER_TEMP/jobs.json"
          gh api repos/agmmltd-arch/agmm-render-public/actions/runs/37212158991/artifacts > "$RUNNER_TEMP/artifacts.json"
          python durable-export-candidate/f06_preview_export.py validate-source \
            --repository "$RUNNER_TEMP/repository.json" --run "$RUNNER_TEMP/run.json" \
            --jobs "$RUNNER_TEMP/jobs.json" --artifacts "$RUNNER_TEMP/artifacts.json" \
            --out "$RUNNER_TEMP/f06-preview-export/source.json"
      - name: Verify hosted disk capacity
        working-directory: durable-export-candidate
        run: python f06_preview_export.py check-capacity
      - name: Download exact native artifact on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/agmmltd-arch/agmm-render-public/actions/artifacts/11306729127/zip \
            > "$RUNNER_TEMP/f06-preview-export/native-artifact.zip"
      - name: Verify digest, members and extract on hosted runner
        working-directory: durable-export-candidate
        run: |
          python f06_preview_export.py extract-artifact \
            --archive "$RUNNER_TEMP/f06-preview-export/native-artifact.zip" \
            --source "$RUNNER_TEMP/f06-preview-export/source.json" \
            --out-dir "$RUNNER_TEMP/f06-preview-export/extracted"
      - name: Prepare exact public preview payload
        working-directory: durable-export-candidate
        run: |
          python f06_preview_export.py prepare \
            --download-dir "$RUNNER_TEMP/f06-preview-export/extracted" \
            --source "$RUNNER_TEMP/f06-preview-export/source.json" \
            --out-dir "$RUNNER_TEMP/f06-preview-export/payload"
      - name: Verify native preview tag and publish only on exact 404
        working-directory: durable-export-candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python f06_preview_export.py publish --export-dir "$RUNNER_TEMP/f06-preview-export/payload"
      - name: Remove hosted source artifact and intermediate review files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/f06-preview-export" "$RUNNER_TEMP/repository.json" "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/artifacts.json"
