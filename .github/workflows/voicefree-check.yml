name: voicefree check
run-name: voicefree check ${{ inputs.tag }}
# p03 (voice-free 20 Oct 2026): the frozen native voice check (assemble 165-172 wpm, local whisper post-checks, voice_lead_check, delivery_critic signal layer)
# on Ubuntu for bake-off variants. Same code as the conductor's hosted route (agmm-short-voice.yml) but without the conductor admission, so it can never
# write a receipts/<ID>.json pointer or touch the daily counter. No provider call: the Mistral and Gemini secrets are not bound to this workflow.
# Inputs come from the PRIVATE repo (deploy key); output is encrypted because the public artifact would carry script text.
on:
  workflow_dispatch:
    inputs:
      private_commit:
        description: 40-hex commit of agmm-video-render holding voice-free/check/<tag>/
        required: true
      tag:
        description: check tag (directory under voice-free/check/)
        required: true
permissions:
  contents: read
concurrency:
  group: voicefree-check-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      TZ: Europe/London
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/voicefree
            .github/scripts/voice-native
            .github/scripts/voice-site
            .github/scripts/voice_effects.py
            .github/scripts/voice-runtime-requirements.txt
          sparse-checkout-cone-mode: false
      - name: Fetch variants (read-only deploy key)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            voice-free/check/${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voicefree-check-${{ runner.os }}-whisper-v1
      - name: Install the native voice runtime (same pins as the hosted route)
        run: |
          set -euo pipefail
          python3 -m pip install -r .github/scripts/voice-runtime-requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo mkdir -p /Users/samwall/alfred/builds
          sudo chown -R "$(id -u):$(id -g)" /Users/samwall
          python3 -m venv /Users/samwall/alfred/venvs/pitch
          /Users/samwall/alfred/venvs/pitch/bin/python -m pip install numpy==2.0.2 praat-parselmouth==0.4.7
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          for repo, rev in (("Systran/faster-whisper-small.en", "d1d751a5f8271d482d14ca55d9e2deeebbae577f"), ("Systran/faster-whisper-base.en", "3d3d5dee26484f91867d81cb899cfcf72b96be6c")):
              p = snapshot_download(repo_id=repo, revision=rev)
              import pathlib
              ref = pathlib.Path(p).parent.parent / "refs/main"; ref.parent.mkdir(exist_ok=True); ref.write_text(rev)
          PY
      - name: Run the native check on each variant
        run: |
          python3 .github/scripts/voicefree/check_short.py --private private --tag "${{ inputs.tag }}" --out "$RUNNER_TEMP/check-out"
      - name: Encrypt (public repo)
        if: always()
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/scripts/voicefree")
          import vf_common as C
          print("encrypted bytes", C.pack_encrypt(os.environ["RUNNER_TEMP"] + "/check-out", os.environ["RUNNER_TEMP"] + "/check-pack.enc"))
          PY
      - name: Upload encrypted pack
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voicefree-check-${{ inputs.tag }}-ENC
          path: ${{ runner.temp }}/check-pack.enc
          retention-days: 7
          if-no-files-found: error
