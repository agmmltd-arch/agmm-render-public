name: Synthetic MiniCPM Omni blinded audio research
run-name: Synthetic MiniCPM Omni blinded audio 20261031
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and test with synthetic speech only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libcurl4-openssl-dev espeak-ng ffmpeg
          git clone -q https://github.com/OpenBMB/llama.cpp-omni.git source
          cd source
          git checkout --detach a64932ec615e1463158129feaf2f0752d0c07a2e
          test "$(git rev-parse HEAD)" = a64932ec615e1463158129feaf2f0752d0c07a2e
          python3 -c 'from pathlib import Path; p=Path("src/llama-moe-slot.cpp"); s=p.read_text(); a="#ifndef _WIN32\n        std::lock_guard<std::mutex> lock(fd_mutex);\n        for (const auto & kv : fds)"; b="#if defined(F_NOCACHE)\n        std::lock_guard<std::mutex> lock(fd_mutex);\n        for (const auto & kv : fds)"; assert s.count(a)==1; s=s.replace(a,b,1); a="        if (experts_nocache_desired() && fcntl(fd, F_NOCACHE, 1) != 0) {\n            moe_log(\"F_NOCACHE 设置失败: %s\", std::strerror(errno));\n        }"; assert s.count(a)==1; s=s.replace(a,"#if defined(F_NOCACHE)\n"+a+"\n#endif",1); p.write_text(s)'
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF
          cp "$GITHUB_WORKSPACE/.github/scripts/minicpmo-synthetic-audio-probe.cpp" tools/omni/test/single_test_audio.cpp
          cmake --build build -j 4 --target llama-omni-single-test-audio
          mkdir -p models
          curl -fL --retry 2 -o models/model.gguf https://huggingface.co/openbmb/MiniCPM-o-4_5-gguf/resolve/db25077c33951fe163b42986fba0132e279872a2/MiniCPM-o-4_5-Q4_K_M.gguf
          curl -fL --retry 2 -o models/audio.gguf https://huggingface.co/openbmb/MiniCPM-o-4_5-gguf/resolve/db25077c33951fe163b42986fba0132e279872a2/audio/MiniCPM-o-4_5-audio-F16.gguf
          echo '1237a97ee081b8abebc47aa7dad565701e8f5f904cdc92f6723ac4281bbc0932  models/model.gguf' | sha256sum -c -
          echo 'd5b188ac7feaf98e17175c3f9bd14bf269301bfd187439fdaa3e3a494fc32ef7  models/audio.gguf' | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/.github/scripts/minicpmo-synthetic-audio-panel.py"
          cp research-results.json "$RUNNER_TEMP/research-results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: minicpmo-synthetic-audio-research-text-only
          path: ${{ runner.temp }}/research-results.json
          if-no-files-found: warn
          retention-days: 7
