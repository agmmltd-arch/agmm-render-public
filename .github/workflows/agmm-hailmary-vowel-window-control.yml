name: AGMM vowel listener control
run-name: Vowel listener isolated controls
on: workflow_dispatch
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/hailmary-vowel-probe.py
          sparse-checkout-cone-mode: false
      - name: Compare isolated vowel controls
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if ! command -v espeak-ng >/dev/null; then timeout 180 sudo apt-get update -qq; timeout 180 sudo apt-get install -y -qq espeak-ng; fi
          python3 -m pip install --quiet imageio-ffmpeg==0.6.0
          espeak-ng -v en-gb -s 150 -w day.wav '[[eI]]'
          espeak-ng -v en-gb -s 150 -w my.wav '[[aI]]'
          echo "day control phonemes: $(espeak-ng -v en-gb -q -x '[[eI]]')"
          echo "my control phonemes: $(espeak-ng -v en-gb -q -x '[[aI]]')"
          espeak-ng -v en-gb -s 150 -w good.wav 'an [[eI aI]] consultancy'
          espeak-ng -v en-gb -s 150 -w bad.wav 'an [[aI aI]] consultancy'
          for sample in good bad; do
            for start in 0.10 0.20 0.30 0.40 0.50 0.60; do
              end=$(python3 -c "print(float('$start')+0.25)")
              echo "$sample $start"; SOURCE="$sample.wav" START="$start" END="$end" python3 .github/scripts/hailmary-vowel-probe.py || true
            done
          done
