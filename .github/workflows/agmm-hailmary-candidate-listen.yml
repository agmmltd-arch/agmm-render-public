name: AGMM Hail Mary candidate listener
run-name: Hail Mary candidates ${{ inputs.film }} ${{ inputs.kind }}
on:
  workflow_dispatch:
    inputs:
      film: { description: Film ID, required: true }
      kind: { description: rows or reveal or website or ai, required: true }
      para: { description: Paragraph ID, required: true }
      voice_run: { description: Voice pack run ID, required: true }
      voice_label: { description: Voice pack label, required: true }
      order: { description: Take order as five digits, required: false, default: '12345' }
      single: { description: Optional single take number, required: false, default: '' }
permissions:
  contents: read
  actions: read
jobs:
  listen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FILM: ${{ inputs.film }}
      KIND: ${{ inputs.kind }}
      PARA: ${{ inputs.para }}
      VOICE_RUN: ${{ inputs.voice_run }}
      VOICE_LABEL: ${{ inputs.voice_label }}
      ORDER: ${{ inputs.order }}
      SINGLE: ${{ inputs.single }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/hailmary-candidate-listen.py
          sparse-checkout-cone-mode: false
      - name: Fetch and decrypt hosted voice pack
        env:
          GH_TOKEN: ${{ github.token }}
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          set -euo pipefail
          [[ "$FILM" =~ ^H(0[2-9]|1[01])$ ]]
          [[ "$KIND" =~ ^(rows|reveal|website|ai)$ ]]
          [[ "$PARA" =~ ^P[1-8]$ ]]
          [[ "$VOICE_RUN" =~ ^[0-9]+$ ]]
          [[ "$VOICE_LABEL" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$ORDER" =~ ^[1-5]{5}$ ]]
          [[ -z "$SINGLE" || "$SINGLE" =~ ^[1-5]$ ]]
          gh run download "$VOICE_RUN" -R "$GITHUB_REPOSITORY" -n "voicefree-chatterbox-$VOICE_LABEL-ENC" -D "$RUNNER_TEMP/vpack"
          mkdir -p voice
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICEFREE_PASS -in "$RUNNER_TEMP/vpack/synth-pack.enc" | tar -x -C voice
      - name: Listen to candidate takes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -m pip install --quiet imageio-ffmpeg==0.6.0
          python3 .github/scripts/hailmary-candidate-listen.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-${{ inputs.film }}-${{ inputs.kind }}
          path: out/listen.json
          retention-days: 7
          if-no-files-found: warn
