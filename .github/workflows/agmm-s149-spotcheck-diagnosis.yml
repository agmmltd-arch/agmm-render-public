name: S149 hosted spotcheck text diagnosis
run-name: S149 hosted spotcheck text diagnosis 20261031
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Extract only text diagnosis on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: python3 .github/scripts/s149-hosted-spotcheck-diagnosis.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s149-spotcheck-diagnosis-text-only
          path: ${{ runner.temp }}/s149-diagnosis.json
          if-no-files-found: error
          retention-days: 7
