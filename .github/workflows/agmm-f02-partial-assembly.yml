name: AGMM F02 partial segment assembly (proposal)
run-name: F02 partial mechanical assembly · ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ASSEMBLE-F02-MECHANICAL-ONLY for mechanical integrity only
        required: true
        type: string
      replacement_run_id:
        description: Exact successful agmm-film.yml run that rendered 01/02/51/52 from the independently reviewed source package
        required: true
        type: string
      replacement_head_sha:
        description: Exact 40-character head SHA from that completed renderer run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: agmm-f02-partial-mechanical-assembly
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REPLACEMENT_RUN_ID: ${{ inputs.replacement_run_id }}
      REPLACEMENT_HEAD_SHA: ${{ inputs.replacement_head_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Require explicit mechanical-only confirmation and pinned repository
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "ASSEMBLE-F02-MECHANICAL-ONLY"
          test "$GITHUB_REPOSITORY" = "agmmltd-arch/agmm-render-public"
          python3 .github/scripts/f02_partial_assembly.py validate-contract \
            --replacement-run-id "$REPLACEMENT_RUN_ID" --replacement-head-sha "$REPLACEMENT_HEAD_SHA"

      - name: Verify checked-out authoritative assembler source hash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/f02_partial_assembly.py verify-authoritative-helper \
            --helper .github/scripts/assemble_verify.py \
            --replacement-run-id "$REPLACEMENT_RUN_ID" --replacement-head-sha "$REPLACEMENT_HEAD_SHA"

      - name: Capture exact run, job, artifact and release metadata
        run: |
          set -euo pipefail
          python3 .github/scripts/f02_partial_assembly.py snapshot --repo "$GITHUB_REPOSITORY" --snapshots metadata \
            --replacement-run-id "$REPLACEMENT_RUN_ID" --replacement-head-sha "$REPLACEMENT_HEAD_SHA"

      - name: Download and hash-check the small durable parent preview receipt
        run: |
          set -euo pipefail
          mkdir -p metadata/preview-download
          gh release download preview-F02-37146440125 -R "$GITHUB_REPOSITORY" \
            -p HOSTED-PREVIEW.json --dir metadata/preview-download
          cp metadata/preview-download/HOSTED-PREVIEW.json metadata/parent-preview-receipt.json

      - name: Preflight current lineage, source, replacement jobs/artifacts, hashes and expiry
        run: |
          set -euo pipefail
          python3 .github/scripts/f02_partial_assembly.py preflight --snapshots metadata \
            --replacement-run-id "$REPLACEMENT_RUN_ID" --replacement-head-sha "$REPLACEMENT_HEAD_SHA"

      - name: Download and verify the sealed F02 source package
        run: |
          set -euo pipefail
          mkdir -p source-download
          SOURCE_RELEASE="$(python3 .github/scripts/f02_partial_assembly.py print-source-release \
            --replacement-run-id "$REPLACEMENT_RUN_ID" --replacement-head-sha "$REPLACEMENT_HEAD_SHA")"
          gh release download "$SOURCE_RELEASE" \
            -R "$GITHUB_REPOSITORY" -p source.tar.gz --dir source-download
          python3 .github/scripts/f02_partial_assembly.py prepare-source \
            --source-archive source-download/source.tar.gz --package-dir package \
            --replacement-run-id "$REPLACEMENT_RUN_ID" --replacement-head-sha "$REPLACEMENT_HEAD_SHA"

      - name: Retain 71 exact current-lineage segments and stage only replacements 01/02/51/52
        run: |
          set -euo pipefail
          python3 .github/scripts/f02_partial_assembly.py download-and-stage \
            --snapshots metadata --downloads downloads --lineage-dir lineage \
            --segments-dir assembly/segments \
            --replacement-run-id "$REPLACEMENT_RUN_ID" --replacement-head-sha "$REPLACEMENT_HEAD_SHA"

      - name: Run verifier self-test on hosted Linux
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 .github/scripts/assemble_verify.py --self-test

      - name: Assemble complete 651.6-second F02 master and proxy on hosted Linux
        run: |
          set -euo pipefail
          mkdir -p remote-final
          cp lineage/F02-LINEAGE.json remote-final/F02-LINEAGE.json
          SEGS_JSON="$(python3 .github/scripts/f02_partial_assembly.py print-segments-json \
            --replacement-run-id "$REPLACEMENT_RUN_ID" --replacement-head-sha "$REPLACEMENT_HEAD_SHA")"
          python3 .github/scripts/assemble_verify.py \
            --segments-json "$SEGS_JSON" --duration 651.6 \
            --segments-dir assembly/segments --package-dir package \
            --output-dir remote-final --fid F02
          python3 .github/scripts/f02_partial_assembly.py final-receipt \
            --lineage-dir lineage --output-dir remote-final \
            --replacement-run-id "$REPLACEMENT_RUN_ID" --replacement-head-sha "$REPLACEMENT_HEAD_SHA"
          python3 .github/scripts/f02_partial_assembly.py refresh-sums --output-dir remote-final

      - name: Export segment-level lineage (originals remain separate from replacements)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: F02-PARTIAL-SEGMENT-LINEAGE-${{ github.run_id }}
          path: |
            lineage/F02-LINEAGE.json
            lineage/parent/
            lineage/replacement/
            metadata/
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Export 4K master and mechanical receipts
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: F02-PARTIAL-MASTER-4K-${{ github.run_id }}
          path: |
            remote-final/F02-MASTER-4K.mp4
            remote-final/F02-LINEAGE.json
            remote-final/F02-PARTIAL-ASSEMBLY-RECEIPT.json
            remote-final/REMOTE-INTEGRITY.json
            remote-final/AUDIO-GAIN-RECEIPT.json
            remote-final/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Export 1080 review proxy and exact derivation receipt
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: F02-PARTIAL-REVIEW-1080-${{ github.run_id }}
          path: |
            remote-final/F02-MASTER-1080-from-4K.mp4
            remote-final/F02-MASTER-1080-from-4K.mp4.derived.json
            remote-final/F02-LINEAGE.json
            remote-final/F02-PARTIAL-ASSEMBLY-RECEIPT.json
            remote-final/REMOTE-INTEGRITY.json
            remote-final/AUDIO-GAIN-RECEIPT.json
            remote-final/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
