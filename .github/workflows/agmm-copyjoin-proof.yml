name: AGMM copy-join proof
run-name: AGMM copy-join proof ${{ inputs.label }}
# Is joining the segments by stream copy (no second lossy encode) safe? (27 Oct 2026)
# seams: real 4K segments of an earlier run, joined by copy: exact frame count, uniform timestamps, decoded frames identical to the segments' own frames at every seam,
#        and per-frame PSNR against that run's old FINAL.mp4 (x264 slow crf 15 re-encode) with the frames around every seam listed.
# quality: one dense span rendered twice (lossless and the segment encode); old chain = segment re-encoded slow crf 15, new chain = segment as is; PSNR and SSIM of each against the lossless frames.
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'par run holding film-<run_label>, seg-<run_label>-N and hailmary-<run_label> (FINAL.mp4)', required: true }
      run_repo: { description: 'repo of that run', required: true }
      run_label: { description: label of that run, required: true }
      label: { description: short label, required: true }
      nframes: { description: 'frames in the quality span', required: false, default: '36' }
      only: { description: 'seams = skip the quality job', required: false, default: both }
      scale: { description: device scale of the quality span (the run used 2), required: false, default: '2' }
permissions:
  contents: read
  actions: read
jobs:
  seams:
    if: github.repository == 'agmmltd-arch/agmm-render-public' || github.repository == 'SamAGMM/agmm-render-b'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Inputs and ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          mkdir -p segs
          gh run download "${{ inputs.run_id }}" -R "${{ inputs.run_repo }}" -p "seg-${{ inputs.run_label }}-*" -D segraw
          find segraw -name 'seg_*.mp4' -exec cp {} segs/ \;
          gh run download "${{ inputs.run_id }}" -R "${{ inputs.run_repo }}" -n "hailmary-${{ inputs.run_label }}" -D old
          ls segs | wc -l; ls -la old/FINAL.mp4
      - name: Copy join and checks
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin:$PATH"
          for f in $(ls segs/seg_*.mp4 | sort -V); do echo "file '$PWD/$f'" ; done > list.txt
          echo "== one segment and the old FINAL"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,level,width,height,pix_fmt,r_frame_rate,color_space,color_primaries,color_transfer,color_range,has_b_frames -of default=nw=1 segs/seg_0.mp4
          echo "-- old FINAL"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,level,width,height,pix_fmt,r_frame_rate,color_space,color_range,nb_frames,duration -of default=nw=1 old/FINAL.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,duration -of default=nw=1 old/FINAL.mp4
          echo "== join by copy"
          ffmpeg -nostdin -y -loglevel error -f concat -safe 0 -i list.txt -an -c:v copy -movflags +faststart picture_copy.mp4
          ls -la picture_copy.mp4
          python3 - <<'PY'
          import subprocess, json, glob, re
          def pk(path):
              out = subprocess.run(["ffprobe", "-v", "error", "-select_streams", "v:0", "-show_entries", "packet=pts_time,dts_time,flags", "-of", "json", path], capture_output=True, text=True, check=True).stdout
              return json.loads(out)["packets"]
          segs = sorted(glob.glob("segs/seg_*.mp4"), key=lambda p: int(re.findall(r"seg_(\d+)", p)[0]))
          counts = [len(pk(s)) for s in segs]
          P = pk("picture_copy.mp4")
          pts = sorted(float(p["pts_time"]) for p in P)
          d = [round(b - a, 5) for a, b in zip(pts, pts[1:])]
          print("segments", len(segs), "frames in segments", sum(counts), "frames in copy", len(P), "frames in old FINAL (video packets)", len(pk("old/FINAL.mp4")))
          print("pts step set:", sorted(set(d)), " first pts", pts[0], " last pts", pts[-1])
          print("COUNT_OK" if sum(counts) == len(P) else "COUNT_MISMATCH", "STEP_OK" if len(set(d)) <= 2 and max(d) < 0.0340 and min(d) > 0.0325 else "STEP_NOT_UNIFORM")
          json.dump(counts, open("counts.json", "w"))
          PY
          echo "== decoded frames: copy join vs the segments' own frames (every seam)"
          ffmpeg -nostdin -v error -i picture_copy.mp4 -map 0:v:0 -fps_mode passthrough -f framemd5 - | grep -v '^#' | awk -F, '{print $6}' > copy.md5
          : > segs.md5
          for f in $(ls segs/seg_*.mp4 | sort -V); do ffmpeg -nostdin -v error -i $f -map 0:v:0 -fps_mode passthrough -f framemd5 - | grep -v '^#' | awk -F, '{print $6}' >> segs.md5; done
          wc -l copy.md5 segs.md5
          if cmp -s copy.md5 segs.md5; then echo "SEAMS_EXACT: every decoded frame of the copy join equals the segments' own frame, in order"; else echo "SEAMS_DIFFER"; diff copy.md5 segs.md5 > md5.diff || true; head -5 md5.diff; fi
          echo "== alignment diagnostics: mean psnr_y of 100 frames from a few places, shifting the old FINAL by -3..+3 frames"
          ffprobe -v error -show_entries stream=index,codec_type,start_time,duration -of csv=p=0 picture_copy.mp4
          ffprobe -v error -show_entries stream=index,codec_type,start_time,duration -of csv=p=0 old/FINAL.mp4
          for F in 200 600 1000; do
            for s in -3 -2 -1 0 1 2 3; do
              A=$((F)); B=$((F+s))
              r=$(ffmpeg -nostdin -v error -i picture_copy.mp4 -i old/FINAL.mp4 -filter_complex "[0:v]select='between(n\\,$A\\,$((A+59)))',setpts=N/30/TB[a];[1:v]select='between(n\\,$B\\,$((B+59)))',setpts=N/30/TB[b];[a][b]psnr=stats_file=d.log" -f null - 2>&1 | tail -1 || true)
              awk -v F=$F -v s=$s '{split($6,a,":"); v=a[2]; if(v=="inf") v=100; t+=v; n++} END {if(n) printf "start %d shift %+d: mean psnr_y %.2f over %d frames\n", F, s, t/n, n}' d.log
            done
          done
          echo "== copy join vs old FINAL, per frame PSNR (luma)"
          ffmpeg -nostdin -v error -threads 4 -i picture_copy.mp4 -i old/FINAL.mp4 -lavfi "[0:v][1:v]psnr=stats_file=psnr.log" -f null - 2>&1 | tail -2 || true
          python3 - <<'PY'
          import json, re
          counts = json.load(open("counts.json"))
          ps = []
          for l in open("psnr.log"):
              m = re.search(r"psnr_y:(\S+)", l); v = m.group(1)
              ps.append(100.0 if v == "inf" else float(v))
          n = len(ps); mean = sum(ps) / n
          print("frames compared", n, " mean %.2f  min %.2f" % (mean, min(ps)))
          seam = 0; bad = 0
          for i, c in enumerate(counts[:-1]):
              seam += c
              win = ps[max(0, seam - 2): seam + 2]
              print("seam %2d at frame %4d: psnr_y of frames -2..+1 = %s" % (i + 1, seam, " ".join("%.1f" % v for v in win)))
              if win and min(win) < mean - 6: bad += 1
          print("SEAM_GLITCHES:", bad)
          PY
          echo "== audio sync: durations"
          ffprobe -v error -show_entries format=duration -of csv=p=0 picture_copy.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 old/FINAL.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=duration -of csv=p=0 old/FINAL.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: copyjoin-seams-${{ inputs.label }}
          path: |
            psnr.log
            counts.json
          retention-days: 3
  quality:
    if: inputs.only != 'seams' && (github.repository == 'agmmltd-arch/agmm-render-public' || github.repository == 'SamAGMM/agmm-render-b')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Runtime, film, openfilm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP" &
          F=$!
          curl -fsSL --retry 4 https://nodejs.org/dist/v22.12.0/node-v22.12.0-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP" &
          N=$!
          wait $F; wait $N
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/node-v22.12.0-linux-x64/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/node-v22.12.0-linux-x64/bin:$PATH"
          gh run download "${{ inputs.run_id }}" -R "${{ inputs.run_repo }}" -n "film-${{ inputs.run_label }}" -D film
          mkdir -p bench && cd bench && npm init -y >/dev/null && npm i --silent openfilm@0.2.5 && node node_modules/playwright-core/cli.js install chromium-headless-shell
      - name: Render the span twice and compare the two chains with the lossless frames
        run: |
          set -euo pipefail
          cat > bench/lossless.mjs <<'JS'
          import { render } from './node_modules/openfilm/src/render.mjs';
          const [dir, a, b, scale, out] = process.argv.slice(2);
          const r = await render([dir, `${a}-${b}`], { scale: Number(scale), workers: 2, out, silent: true,
            format: { video: ['-c:v', 'libx264', '-preset', 'ultrafast', '-qp', '0', '-colorspace', 'bt709', '-color_primaries', 'bt709', '-color_trc', 'bt709', '-color_range', 'tv'], pix: 'scale=out_color_matrix=bt709:out_range=tv,format=yuv420p' } });
          console.log(r.lines.join('\n'));
          JS
          read S < <(python3 -c "
          import json; tl=json.load(open('film/assets/timeline.json')); A=tl['a']; W=tl['world_at']
          print(round((float(A['ten'])+float(W))/2,2))")
          E=$(python3 -c "print(round($S + ${{ inputs.nframes }}/30, 4))")
          echo "span $S - $E"
          node bench/lossless.mjs film "$S" "$E" "${{ inputs.scale }}" lossless.mp4 2>&1 | tail -3
          # the segment encode exactly as par.yml makes it
          (cd film && npx -y openfilm@0.2.5 render "$S-$E" --scale "${{ inputs.scale }}" --workers 2 --out ../segment.mp4 2>&1 | tail -3)
          ls -la lossless.mp4 segment.mp4
          # old chain: the join's second encode, command copied from par.yml
          ffmpeg -nostdin -y -loglevel error -i segment.mp4 -an -c:v libx264 -preset slow -crf 15 -profile:v high -level 5.2 -pix_fmt yuv420p -r 30 -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv old_chain.mp4
          ls -la old_chain.mp4
          for v in old_chain segment; do
            ffmpeg -nostdin -v error -threads 4 -i $v.mp4 -i lossless.mp4 -lavfi "[0:v][1:v]psnr=stats_file=$v.psnr" -f null - 2>&1 | tail -2 || true
            ffmpeg -nostdin -v error -threads 4 -i $v.mp4 -i lossless.mp4 -lavfi "[0:v][1:v]ssim=stats_file=$v.ssim" -f null - 2>&1 | tail -2 || true
            python3 - $v <<'PY'
          import re, sys
          v = sys.argv[1]
          ps = []
          for l in open(v + ".psnr"):
              m = re.search(r"psnr_y:(\S+)", l); ps.append(100.0 if m.group(1) == "inf" else float(m.group(1)))
          ss = [float(re.search(r"All:(\S+)", l).group(1)) for l in open(v + ".ssim")]
          print("%-10s vs lossless: frames %d  PSNR_Y mean %.3f dB  min %.3f dB   SSIM mean %.5f  min %.5f   file %d bytes" % (v, len(ps), sum(ps) / len(ps), min(ps), sum(ss) / len(ss), min(ss), __import__("os").path.getsize(v + ".mp4")))
          PY
          done
