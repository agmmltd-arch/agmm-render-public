name: AGMM encrypted short package render candidate
run-name: AGMM short ${{ inputs.tag }}

# Public-repository Ubuntu runners keep every media operation off the operator's Mac.
# The workflow is mechanical only: it cannot approve, publish, arm or dispatch a short.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed encrypted native build run ID
        required: true
      runtime_commit:
        description: Exact candidate runtime commit
        required: true
      source_sha256:
        description: Exact SHA256 of source.tar.gz
        required: true
      parts_sha256:
        description: Exact SHA256 of parts.json
        required: true
      mix_sha256:
        description: Exact SHA256 of mix.wav
        required: true
      tag:
        description: Safe label used only for concurrency and artifact names
        required: true
      render_4k:
        description: Also render and assemble the native 2160x3840 short master
        type: boolean
        required: false
        default: false
      workers:
        description: HyperFrames Chrome workers per hosted render
        type: choice
        options: ['1', '2', '3']
        required: false
        default: '2'
  workflow_call:
    inputs:
      source_run_id:
        description: Completed encrypted native build run ID
        type: string
        required: true
      runtime_commit:
        description: Exact candidate runtime commit
        type: string
        required: true
      source_sha256:
        description: Exact SHA256 of source.tar.gz
        type: string
        required: true
      parts_sha256:
        description: Exact SHA256 of parts.json
        type: string
        required: true
      mix_sha256:
        description: Exact SHA256 of mix.wav
        type: string
        required: true
      tag:
        description: Safe label used only for concurrency and artifact names
        type: string
        required: true
      render_4k:
        description: Also render and assemble the native 2160x3840 short master
        type: boolean
        required: false
        default: false
      workers:
        description: HyperFrames Chrome workers per hosted render
        type: string
        required: false
        default: '2'
    secrets:
      VOICEFREE_PASS:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: agmm-short-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'agmmltd-arch/agmm-render-public' && inputs.runtime_commit == '00762f35505d51ea41098977e9658bc8e6cb724d'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
      RUNTIME_COMMIT: ${{ inputs.runtime_commit }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PARTS_SHA256: ${{ inputs.parts_sha256 }}
      MIX_SHA256: ${{ inputs.mix_sha256 }}
      TAG: ${{ inputs.tag }}
      RENDER_4K: ${{ inputs.render_4k }}
      WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.runtime_commit }}
          persist-credentials: false
      - name: Validate workflow labels before using them
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{6,}$ ]]
          [[ "$RUNTIME_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RUNTIME_COMMIT"
          PYTHONPATH=.github/scripts python3 -c 'import voice_hosted; voice_hosted.source_closure()' 
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$WORKERS" =~ ^[123]$ ]]
      - name: Install hosted media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet Pillow
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          name: NATIVE-BUILD-INPUT-${{ inputs.source_run_id }}
          path: sealed-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          name: NATIVE-BUILD-METADATA-${{ inputs.source_run_id }}
          path: sealed-metadata
      - name: Verify original native producer and decrypt exact inputs
        run: |
          set -euo pipefail
          S=.github/scripts/hosted-youtube-candidate
          python3 "$S/verify_build_producer.py" --run-id "$SOURCE_RUN_ID" --metadata sealed-metadata/metadata.enc \
            --source-sha256 "$SOURCE_SHA256" --parts-sha256 "$PARTS_SHA256" --mix-sha256 "$MIX_SHA256"
          python3 "$S/seal_build_inputs.py" unseal --archive sealed-input/native-build-input.enc --out exact-input \
            --source-sha256 "$SOURCE_SHA256" --parts-sha256 "$PARTS_SHA256" --mix-sha256 "$MIX_SHA256"
      - name: Verify hashes, archive, part contract and source mix
        id: contract
        run: |
          set -euo pipefail
          FOUR_K=(); [[ "$RENDER_4K" = "true" ]] && FOUR_K+=(--render-4k)
          .venv/bin/python .github/scripts/render_short_package.py prepare \
            --source exact-input/source.tar.gz --parts exact-input/parts.json --mix exact-input/mix.wav \
            --source-sha256 "$SOURCE_SHA256" --parts-sha256 "$PARTS_SHA256" --mix-sha256 "$MIX_SHA256" \
            --output preflight "${FOUR_K[@]}"
          cp preflight/INPUT-RECEIPT.json preflight/MATRIX.json preflight/NORMALISED-PARTS.json exact-input/
          printf 'matrix=%s\n' "$(jq -c . preflight/MATRIX.json)" >> "$GITHUB_OUTPUT"
      - name: Upload the hash-bound hosted input bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.tag }}-EXACT-INPUT
          path: sealed-input/native-build-input.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  render:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
      OUT: ${{ matrix.out }}
      LOOK: ${{ matrix.look }}
      FILE: ${{ matrix.file }}
      DURATION: ${{ matrix.dur }}
      RESOLUTION: ${{ matrix.resolution }}
      SUFFIX: ${{ matrix.suffix }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PARTS_SHA256: ${{ inputs.parts_sha256 }}
      MIX_SHA256: ${{ inputs.mix_sha256 }}
      WORKERS: ${{ inputs.workers }}
      HYPERFRAMES_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.runtime_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce
        with:
          chrome-version: stable
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.tag }}-EXACT-INPUT
          path: sealed-input
      - name: Re-verify and safely extract the exact package
        run: |
          set -euo pipefail
          python3 .github/scripts/hosted-youtube-candidate/seal_build_inputs.py unseal \
            --archive sealed-input/native-build-input.enc --out exact-input --source-sha256 "$SOURCE_SHA256" \
            --parts-sha256 "$PARTS_SHA256" --mix-sha256 "$MIX_SHA256"
          test "$(sha256sum exact-input/source.tar.gz | cut -d ' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum exact-input/parts.json | cut -d ' ' -f1)" = "$PARTS_SHA256"
          test "$(sha256sum exact-input/mix.wav | cut -d ' ' -f1)" = "$MIX_SHA256"
          python3 - <<'PYCODE'
          import pathlib, sys
          sys.path.insert(0, ".github/scripts")
          import render_short_package as short
          short.safe_extract(pathlib.Path("exact-input/source.tar.gz"), pathlib.Path("project"))
          PYCODE
          cd "project/$LOOK"
          sha256sum -c SHA256SUMS.txt >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/render-output"
          env -u VOICEFREE_PASS python3 static_check.py > "$GITHUB_WORKSPACE/render-output/$OUT$SUFFIX.static.log" 2>&1 || {
            echo 'Static check failed; detailed log remains inside the encrypted artifact.' >&2
            exit 1
          }
      - name: Render exact part with the pinned short-kit version
        working-directory: project/${{ matrix.look }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/render-output"
          RESOLUTION_FLAG=()
          [[ "$RESOLUTION" = "4k" ]] && RESOLUTION_FLAG+=(--resolution portrait-4k)
          env -u VOICEFREE_PASS npx --yes hyperframes@0.8.71 render -c "$FILE" --fps 30 --workers "$WORKERS" \
            --quality high "${RESOLUTION_FLAG[@]}" \
            --player-ready-timeout 180000 --protocol-timeout 600000 \
            --output "$GITHUB_WORKSPACE/render-output/$OUT$SUFFIX.raw.mp4" \
            > "$GITHUB_WORKSPACE/render-output/$OUT$SUFFIX.render.log" 2>&1 || {
              echo 'Render failed; detailed log remains inside the encrypted artifact.' >&2
              exit 1
            }
      - name: Apply exact produce.py delivery cap
        run: |
          set -euo pipefail
          python3 .github/scripts/render_short_package.py cap-part \
            --input "render-output/$OUT$SUFFIX.raw.mp4" --output "render-output/$OUT$SUFFIX.mp4" \
            --resolution "$RESOLUTION" --receipt "render-output/$OUT$SUFFIX.cap.json"
          python3 .github/scripts/render_short_package.py verify-part \
            --video "render-output/$OUT$SUFFIX.mp4" --resolution "$RESOLUTION" \
            --duration "$DURATION" --output "render-output/$OUT$SUFFIX.verify.json"
          rm "render-output/$OUT$SUFFIX.raw.mp4"
      - name: Encrypt exact part and evidence
        if: success()
        run: |
          set -euo pipefail
          mkdir sealed-part
          python3 .github/scripts/hosted-youtube-candidate/sealed_render_artifact.py seal \
            --input render-output --out "sealed-part/$OUT$SUFFIX.enc"
      - name: Upload encrypted exact part and evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.tag }}-PART-${{ matrix.out }}${{ matrix.suffix }}
          path: sealed-part/*.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Encrypt available failed-render evidence
        if: failure()
        run: |
          set -euo pipefail
          if test -d render-output && find render-output -type f -print -quit | grep -q .; then
            mkdir -p sealed-failure
            python3 .github/scripts/hosted-youtube-candidate/sealed_render_artifact.py seal --input render-output --out sealed-failure/failure.enc
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: ${{ inputs.tag }}-FAIL-${{ matrix.out }}${{ matrix.suffix }}
          path: sealed-failure/failure.enc
          retention-days: 1
          if-no-files-found: warn

  assemble:
    needs: [preflight, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PARTS_SHA256: ${{ inputs.parts_sha256 }}
      MIX_SHA256: ${{ inputs.mix_sha256 }}
      RENDER_4K: ${{ inputs.render_4k }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.runtime_commit }}
          persist-credentials: false
      - name: Install hosted assembly and review dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet Pillow
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.tag }}-EXACT-INPUT
          path: sealed-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.tag }}-PART-*
          path: sealed-renders
          merge-multiple: true
      - name: Open authenticated render parts and exact build inputs
        run: |
          set -euo pipefail
          S=.github/scripts/hosted-youtube-candidate
          python3 "$S/seal_build_inputs.py" unseal --archive sealed-input/native-build-input.enc --out exact-input \
            --source-sha256 "$SOURCE_SHA256" --parts-sha256 "$PARTS_SHA256" --mix-sha256 "$MIX_SHA256"
          mkdir hosted-renders
          for f in sealed-renders/*.enc; do
            test -f "$f"
            out="$RUNNER_TEMP/part-$(basename "$f" .enc)"
            python3 "$S/sealed_render_artifact.py" unseal --input "$f" --out "$out"
            for p in "$out"/*; do
              test -f "$p" && test ! -e "hosted-renders/$(basename "$p")"
              cp "$p" hosted-renders/
            done
          done
      - name: Assemble and fully verify 1080 and optional 4K masters
        run: |
          set -euo pipefail
          FOUR_K=(); [[ "$RENDER_4K" = "true" ]] && FOUR_K+=(--render-4k)
          .venv/bin/python .github/scripts/render_short_package.py assemble \
            --parts exact-input/parts.json --mix exact-input/mix.wav \
            --parts-sha256 "$PARTS_SHA256" --mix-sha256 "$MIX_SHA256" \
            --renders hosted-renders --output remote-final "${FOUR_K[@]}"
      - name: Encrypt masters and review evidence
        if: success()
        run: |
          set -euo pipefail
          mkdir sealed-final
          python3 .github/scripts/hosted-youtube-candidate/sealed_render_artifact.py seal --input remote-final --out sealed-final/final.enc
      - name: Upload encrypted masters and review evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.tag }}-FINAL-SEALED
          path: sealed-final/final.enc
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
