name: AGMM film segments render
run-name: AGMM film ${{ inputs.tag }}

# Root, 30 Sep 2026: long-form films render here, on free public-repo Actions minutes, up to 20 segments in parallel.
# Byte-for-byte the same per-segment commands as films/tools/render_codespace_film.py (hyperframes@0.8.71, same caps),
# driven by films/tools/render_actions_film.py, which uploads the sealed package as a release asset, dispatches this
# workflow, downloads the SEG artifacts and verifies every one (dimensions, exact frame count, flicker) locally.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag holding source.tar.gz
        required: true
      package_sha256:
        description: sha256 of source.tar.gz
        required: true
      comp:
        description: Composition folder inside the package
        required: true
        default: film
      segvar:
        description: The window.<X>_SEG variable name
        required: true
      segs:
        description: 'JSON list of {"i":"01","t0":0,"len":8.6}'
        required: true
      res:
        description: "'' for 1920x1080 or 'landscape-4k'"
        required: false
        default: ""
      workers:
        description: hyperframes Chrome workers per runner
        required: false
        default: "2"
      tag:
        description: Run label for artifact names
        required: true
      remote_only:
        description: Keep all media processing and verification on hosted runners; return artifact metadata only
        type: boolean
        required: false
        default: false
      assemble_full:
        description: Assemble a complete 73-segment F07 4K run on the hosted runner
        type: boolean
        required: false
        default: false
      overlay_release_asset:
        description: Optional code-only QA overlay release asset filename
        required: false
        default: ""
      overlay_release:
        description: Optional release tag holding the QA overlay; defaults to the source release
        required: false
        default: ""
      overlay_sha256:
        description: SHA256 of the optional QA overlay archive
        required: false
        default: ""
      apply_source_overlay:
        description: Apply film source files carried by the QA overlay; disable when the sealed package already contains the reviewed source
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        seg: ${{ fromJSON(inputs.segs) }}
    env:
      I: ${{ matrix.seg.i }}
      T0: ${{ matrix.seg.t0 }}
      LN: ${{ matrix.seg.len }}
      COMP: ${{ inputs.comp }}
      SEGVAR: ${{ inputs.segvar }}
      RES: ${{ inputs.res }}
      WORKERS: ${{ inputs.workers }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: System packages (same list as the codespace SETUP)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 \
            libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 fonts-liberation >/dev/null
          ffmpeg -version | head -1
          npx --yes hyperframes@0.8.71 --version
      - name: Enforce remote-only 4K route
        if: ${{ inputs.remote_only }}
        run: test "$RES" = "landscape-4k" && test "$COMP" = "film"
      - name: Fetch and verify the sealed package
        run: |
          set -euo pipefail
          gh release download "${{ inputs.release }}" -R "${{ github.repository }}" -p source.tar.gz
          test "$(sha256sum source.tar.gz | cut -d ' ' -f1)" = "${{ inputs.package_sha256 }}"
          mkdir -p project out qa_overlay
          tar -xzf source.tar.gz -C project
          (cd project && sha256sum -c SHA256SUMS.txt >/dev/null && python3 static_check.py)
          grep -q "window.${SEGVAR} = null;" "project/$COMP/index.html"
      - name: Fetch and safely unpack the hash-bound code-only QA overlay
        if: ${{ inputs.remote_only }}
        env:
          RELEASE: ${{ inputs.overlay_release || inputs.release }}
          OVERLAY_ASSET: ${{ inputs.overlay_release_asset }}
          OVERLAY_SHA256: ${{ inputs.overlay_sha256 }}
        run: |
          set -euo pipefail
          test -n "$OVERLAY_ASSET" && test -n "$OVERLAY_SHA256"
          gh release download "$RELEASE" -R "${{ github.repository }}" -p "$OVERLAY_ASSET"
          test "$(sha256sum "$OVERLAY_ASSET" | cut -d ' ' -f1)" = "$OVERLAY_SHA256"
          python3 - "$OVERLAY_ASSET" qa_overlay <<'PYCODE'
          import pathlib, shutil, sys, tarfile
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]).resolve()
          allowed = {".github/scripts/assemble_verify.py", ".github/scripts/run_existing_ocr_check.py",
                     "qa/gate.py", "kit/tools/frame_check.py", "kit/tools/ocr_vision.swift",
                     "kit/platforms/platforms.py", "kit/platforms/frames.json", "film/film.js",
                     "film/film.css", "film/sets_studio.js", "film-overlay.sha256"}
          total = 0
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              if len(members) != len(allowed) or {m.name for m in members} != allowed:
                  raise SystemExit("QA overlay member list differs from the exact allowlist")
              for m in members:
                  if not m.isfile() or m.size > 2_000_000:
                      raise SystemExit("QA overlay has a non-file or over-limit entry")
                  total += m.size
                  if total > 8_000_000:
                      raise SystemExit("QA overlay exceeds the 8 MB expanded limit")
                  dest = (out / m.name).resolve()
                  if out not in dest.parents:
                      raise SystemExit("QA overlay path escapes destination")
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  src = tf.extractfile(m)
                  if src is None:
                      raise SystemExit("QA overlay entry is unreadable")
                  with dest.open("wb") as f:
                      shutil.copyfileobj(src, f)
          PYCODE
      - name: Apply the hash-bound reviewed film source overlay
        if: ${{ inputs.remote_only && inputs.apply_source_overlay }}
        run: |
          (cd qa_overlay && sha256sum -c film-overlay.sha256)
          cp qa_overlay/film/film.js "project/$COMP/film.js"
          cp qa_overlay/film/film.css "project/$COMP/film.css"
          cp qa_overlay/film/sets_studio.js "project/$COMP/sets_studio.js"
          (cd project && python3 static_check.py)
      - name: Render segment
        run: |
          cd project
          cp -R "$COMP" "seg$I"
          sed -i "s|window.${SEGVAR} = null;|window.${SEGVAR} = { t0: ${T0}, len: ${LN} };|" "seg$I/index.html"
          sed -i -E "s|data-duration=\"[0-9.]+\"|data-duration=\"${LN}\"|" "seg$I/index.html"
          RESFLAG=""; [ -n "$RES" ] && RESFLAG="--resolution $RES"
          cd "seg$I"
          HYPERFRAMES_NO_TELEMETRY=1 npx --yes hyperframes@0.8.71 render --fps 30 --workers "$WORKERS" --quality high $RESFLAG \
            --player-ready-timeout 180000 --protocol-timeout 600000 --output "$GITHUB_WORKSPACE/out/SEG$I.raw.mp4" \
            > "$GITHUB_WORKSPACE/out/SEG$I.render.log" 2>&1 || { tail -40 "$GITHUB_WORKSPACE/out/SEG$I.render.log"; exit 1; }
          if [ -n "$RES" ]; then
            CAP="-map 0:v:0 -an -c:v libx264 -profile:v high -preset slow -crf 17 -maxrate 60M -bufsize 120M -level:v 5.1 -pix_fmt yuv420p -r 30 -g 60 -video_track_timescale 15360 -movflags +faststart"
          else
            CAP="-map 0:v:0 -an -c:v libx264 -profile:v high -preset slow -crf 16 -maxrate 25M -bufsize 50M -level:v 4.2 -pix_fmt yuv420p -r 30 -g 60 -video_track_timescale 15360 -movflags +faststart"
          fi
          ffmpeg -hide_banner -loglevel error -y -i "$GITHUB_WORKSPACE/out/SEG$I.raw.mp4" $CAP "$GITHUB_WORKSPACE/out/SEG$I.mp4"
          rm -f "$GITHUB_WORKSPACE/out/SEG$I.raw.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of csv=p=0 "$GITHUB_WORKSPACE/out/SEG$I.mp4"
      - name: Hosted full decode, probe and flicker verification
        if: ${{ inputs.remote_only }}
        run: |
          FRAMES=$(python3 -c 'import os; print(round(float(os.environ["LN"]) * 30))')
          python3 qa_overlay/.github/scripts/assemble_verify.py --check-segment \
            "out/SEG${I}.mp4" --expected-frames "$FRAMES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.tag }}-SEG${{ matrix.seg.i }}
          path: |
            out/SEG${{ matrix.seg.i }}.mp4
            out/SEG${{ matrix.seg.i }}.render.log
            out/SEG${{ matrix.seg.i }}.verify.json
          retention-days: 1
          if-no-files-found: warn

  assemble:
    if: ${{ inputs.remote_only && inputs.assemble_full && inputs.res == 'landscape-4k' && inputs.comp == 'film' }}
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SEGS_JSON: ${{ inputs.segs }}
      RELEASE: ${{ inputs.release }}
      PACKAGE_SHA256: ${{ inputs.package_sha256 }}
      OVERLAY_ASSET: ${{ inputs.overlay_release_asset }}
      OVERLAY_SHA256: ${{ inputs.overlay_sha256 }}
      OVERLAY_RELEASE: ${{ inputs.overlay_release || inputs.release }}
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.tag }}-SEG*
          path: segments
          merge-multiple: true
      - name: Fetch hash-bound source and QA overlay
        run: |
          set -euo pipefail
          gh release download "$RELEASE" -R "${{ github.repository }}" -p source.tar.gz
          test "$(sha256sum source.tar.gz | cut -d ' ' -f1)" = "$PACKAGE_SHA256"
          gh release download "$OVERLAY_RELEASE" -R "${{ github.repository }}" -p "$OVERLAY_ASSET"
          test "$(sha256sum "$OVERLAY_ASSET" | cut -d ' ' -f1)" = "$OVERLAY_SHA256"
          mkdir -p package qa_overlay
          tar -xzf source.tar.gz -C package
          python3 - "$OVERLAY_ASSET" qa_overlay <<'PYCODE'
          import pathlib, shutil, sys, tarfile
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]).resolve()
          allowed = {".github/scripts/assemble_verify.py", ".github/scripts/run_existing_ocr_check.py",
                     "qa/gate.py", "kit/tools/frame_check.py", "kit/tools/ocr_vision.swift",
                     "kit/platforms/platforms.py", "kit/platforms/frames.json", "film/film.js",
                     "film/film.css", "film/sets_studio.js", "film-overlay.sha256"}
          with tarfile.open(archive, "r:gz") as tf:
              ms=tf.getmembers()
              if len(ms)!=len(allowed) or {m.name for m in ms}!=allowed: raise SystemExit("overlay allowlist mismatch")
              for m in ms:
                  if not m.isfile() or m.size>2_000_000: raise SystemExit("overlay entry invalid")
                  d=(out/m.name).resolve()
                  if out not in d.parents: raise SystemExit("overlay path traversal")
                  d.parent.mkdir(parents=True,exist_ok=True)
                  with d.open("wb") as f: shutil.copyfileobj(tf.extractfile(m),f)
          PYCODE
          (cd package && sha256sum -c SHA256SUMS.txt && python3 static_check.py)
      - name: Apply the hash-bound reviewed film source overlay
        run: |
          (cd qa_overlay && sha256sum -c film-overlay.sha256)
          cp qa_overlay/film/film.js package/film/film.js
          cp qa_overlay/film/film.css package/film/film.css
          cp qa_overlay/film/sets_studio.js package/film/sets_studio.js
          (cd package && python3 static_check.py)
      - name: Assemble and fully verify on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DURATION=$(python3 - <<'PYCODE'
          import re
          from pathlib import Path
          text = (Path("package") / "film" / "index.html").read_text()
          match = re.search(r'data-duration="([0-9.]+)"', text)
          if not match:
              raise SystemExit("composition duration missing")
          print(match.group(1))
          PYCODE
          )
          python3 qa_overlay/.github/scripts/assemble_verify.py --segments-json "$SEGS_JSON" \
            --duration "$DURATION" --segments-dir segments --package-dir package --output-dir remote-final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.tag }}-AUDIO-GAIN-RECEIPT
          path: remote-final/AUDIO-GAIN-RECEIPT.json
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.tag }}-AUDIO-GAIN-PROOF
          path: remote-final/F07-MIX-GAIN-ADJUSTED.flac
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.tag }}-MASTER-4K
          path: |
            remote-final/F07-MASTER-4K.mp4
            remote-final/AUDIO-GAIN-RECEIPT.json
            remote-final/REMOTE-INTEGRITY.json
            remote-final/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.tag }}-REVIEW-1080
          path: |
            remote-final/F07-MASTER-1080-from-4K.mp4
            remote-final/F07-MASTER-1080-from-4K.mp4.derived.json
            remote-final/AUDIO-GAIN-RECEIPT.json
            remote-final/REMOTE-INTEGRITY.json
            remote-final/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  macos-ocr:
    if: ${{ inputs.remote_only && inputs.assemble_full }}
    needs: assemble
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.tag }}-REVIEW-1080
          path: review
          merge-multiple: true
      - name: Fetch and safely extract OCR code overlay
        env:
          RELEASE: ${{ inputs.release }}
          OVERLAY_ASSET: ${{ inputs.overlay_release_asset }}
          OVERLAY_SHA256: ${{ inputs.overlay_sha256 }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE" -R "${{ github.repository }}" -p "$OVERLAY_ASSET"
          test "$(shasum -a 256 "$OVERLAY_ASSET" | cut -d ' ' -f1)" = "$OVERLAY_SHA256"
          mkdir qa_overlay
          python3 - "$OVERLAY_ASSET" qa_overlay <<'PYCODE'
          import pathlib, shutil, sys, tarfile
          archive, out=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2]).resolve()
          allowed={".github/scripts/assemble_verify.py",".github/scripts/run_existing_ocr_check.py","qa/gate.py","kit/tools/frame_check.py","kit/tools/ocr_vision.swift","kit/platforms/platforms.py","kit/platforms/frames.json","film/film.js","film/film.css","film/sets_studio.js","film-overlay.sha256"}
          with tarfile.open(archive,"r:gz") as tf:
            ms=tf.getmembers()
            if len(ms)!=len(allowed) or {m.name for m in ms}!=allowed: raise SystemExit("overlay allowlist mismatch")
            for m in ms:
              if not m.isfile() or m.size>2_000_000: raise SystemExit("overlay entry invalid")
              d=(out/m.name).resolve()
              if out not in d.parents: raise SystemExit("overlay path traversal")
              d.parent.mkdir(parents=True,exist_ok=True)
              with d.open("wb") as f: shutil.copyfileobj(tf.extractfile(m),f)
          PYCODE
      - name: Build exact native Vision OCR and run existing Check 2 only
        run: |
          set -euo pipefail
          brew install ffmpeg
          swiftc -O -framework Foundation -framework Vision -framework AppKit -o qa_overlay/kit/tools/ocr_vision qa_overlay/kit/tools/ocr_vision.swift
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet numpy pillow
          .venv/bin/python qa_overlay/.github/scripts/run_existing_ocr_check.py --video review/F07-MASTER-1080-from-4K.mp4 --v2-root qa_overlay --out ocr-results --platform youtube
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.tag }}-MACOS-VISION-OCR
          path: ocr-results/OCR-CHECK-2.json
          retention-days: 1
          if-no-files-found: warn
