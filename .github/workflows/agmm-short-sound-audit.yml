name: AGMM exact-master native sound audit
run-name: AGMM exact-master sound ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      label:
        description: Durable native owner intent label
        required: true
        type: string
      payload:
        description: Exact approved-source/master/protected-input binding JSON
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: agmm-exact-sound-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  native-sound-audit:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      AGMM_HOSTED_SOUND_AUDIT: '1'
      SOUND_PAYLOAD: ${{ inputs.payload }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact public source runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source closure and protected-input coordinates
        id: binding
        run: python3 .github/scripts/sound_audit_existing.py --preflight
      - name: Checkout exact protected inputs using the existing read-only deploy key
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ steps.binding.outputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-sound-inputs
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.binding.outputs.private_prefix }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: Install pinned NumPy and the established public-render media runtime
        run: |
          set -euo pipefail
          printf '%s\n' 'numpy==2.2.6 --hash=sha256:fd83c01228a688733f1ded5201c678f0c53ecc1006ffbc404db9f7a899ac6249' > "$RUNNER_TEMP/sound-requirements.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/sound-requirements.txt"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v gh git nice ffmpeg ffprobe > /dev/null
          python3 -c 'import sys,numpy; assert sys.version_info[:3] == (3,12,8); assert numpy.__version__ == "2.2.6"'
      - name: Verify exact master and native inputs, run full unchanged audit
        run: |
          set -euo pipefail
          python3 .github/scripts/sound_audit_existing.py \
            --private-root "$GITHUB_WORKSPACE/private-sound-inputs" \
            --work "$RUNNER_TEMP/native-sound" --output "$RUNNER_TEMP/sound-json"
      - name: Export only native audit JSON and exact provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.label }}-JSON
          path: |
            ${{ runner.temp }}/sound-json/audit.json
            ${{ runner.temp }}/sound-json/RECEIPT.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
