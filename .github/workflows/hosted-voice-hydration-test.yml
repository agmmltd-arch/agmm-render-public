name: AGMM hosted voice hydration proof
run-name: AGMM voice hydration proof ${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      runtime_commit:
        type: string
        required: true
      pointer:
        description: Text-free native metadata pointer, never audio or credentials
        type: string
        required: true
      smoke_imports:
        type: boolean
        default: false
        required: true
      synthetic_ocr:
        type: boolean
        default: false
        required: true
      format_commit:
        type: string
        default: ''
        required: false
      format_prefix:
        type: string
        default: ''
        required: false
      format_manifest_blob:
        type: string
        default: ''
        required: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
      POINTER: ${{ inputs.pointer }}
      RUNTIME_COMMIT: ${{ inputs.runtime_commit }}
    steps:
      - name: Check exact candidate runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agmm-native-runtime-${{ inputs.runtime_commit }}
          persist-credentials: false
      - name: Validate source coordinates
        id: binding
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          p=json.loads(os.environ['POINTER']); r=p['request']; c=os.environ['RUNTIME_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}',c) and subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==c
          assert re.fullmatch(r'[0-9a-f]{40}',p['runtime_commit']) and p['id']=='S273' and r['id']=='S273'
          assert re.fullmatch(r'[0-9a-f]{40}',r['private_commit'])
          assert re.fullmatch(r'voice-hosted-inputs/S273-[0-9]+',r['private_prefix'])
          Path(os.environ['RUNNER_TEMP']+'/pointer.json').write_text(json.dumps(p))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('commit='+r['private_commit']+'\nprefix='+r['private_prefix']+'\n')
          PY
      - name: Read bound private source text
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ steps.binding.outputs.commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-voice-inputs
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.binding.outputs.prefix }}
      - name: Check protected format input coordinates
        if: inputs.format_prefix != ''
        env:
          FORMAT_COMMIT: ${{ inputs.format_commit }}
          FORMAT_PREFIX: ${{ inputs.format_prefix }}
          FORMAT_MANIFEST: ${{ inputs.format_manifest_blob }}
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['FORMAT_COMMIT'])
          assert re.fullmatch(r'format-hosted-inputs/runtime-[0-9]+',os.environ['FORMAT_PREFIX'])
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['FORMAT_MANIFEST'])
          PY
      - name: Read exact protected format inputs
        if: inputs.format_prefix != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.format_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-format-inputs
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ inputs.format_prefix }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: Prepare the existing hosted runtime
        run: |
          set -euo pipefail
          python3 -m pip install -r .github/scripts/voice-runtime-requirements.txt
          sudo mkdir -p /Users/samwall/alfred/builds
          sudo chown -R "$(id -u):$(id -g)" /Users/samwall
      - name: Hydrate existing checked voice into native builder layout
        run: |
          python3 - <<'PY'
          import json,os,shutil,sys
          from pathlib import Path
          sys.path.insert(0,'.github/scripts')
          from voice_hosted import BASE,NATIVE
          from stage_hosted_voice import hydrate
          assert not BASE.exists() and not (Path.home()/'alfred').exists()
          shutil.copytree(NATIVE,BASE)
          (Path.home()/'alfred').symlink_to(BASE.parents[2],target_is_directory=True)
          p=json.loads(Path(os.environ['RUNNER_TEMP']+'/pointer.json').read_text())
          result=hydrate(p,p['request'],Path('private-voice-inputs').resolve(),Path(os.environ['RUNNER_TEMP'])/'voice-hydration',BASE)
          assert result['status']=='EXACT_VOICE_HYDRATED_FOR_EXISTING_HOSTED_BUILDER'
          assert result['release_approved'] is False and result['storyboard_approved'] is False
          print('Hosted voice hydration passed; storyboard and release review still required')
          PY
      - name: Verify and stage protected format inputs on Ubuntu
        if: inputs.format_prefix != ''
        env:
          FORMAT_COMMIT: ${{ inputs.format_commit }}
          FORMAT_PREFIX: ${{ inputs.format_prefix }}
          FORMAT_MANIFEST: ${{ inputs.format_manifest_blob }}
        run: |
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'.github/scripts')
          from voice_hosted import BASE
          from stage_format_inputs_hosted import stage
          coords={'commit':os.environ['FORMAT_COMMIT'],'prefix':os.environ['FORMAT_PREFIX'],'manifest_blob':os.environ['FORMAT_MANIFEST']}
          result=stage(Path('private-format-inputs').resolve(),coords,BASE)
          assert result['production_approval'] is False
          print('Protected format input count verified:',result['count'])
          PY
      - name: Smoke-test candidate format imports only
        if: inputs.smoke_imports == true
        run: |
          python3 - <<'PYCODE'
          import sys
          from pathlib import Path
          root=Path('/Users/samwall/alfred/builds/video-program-2026-09-23/v2')
          sys.path.insert(0,str(root/'kit/tools'))
          import format_engine, extract_story, precheck_all, craft_check
          print('Core imports completed; no production, precheck or review executed')
          PYCODE
      - name: Test unqualified OCR on synthetic controls
        if: inputs.synthetic_ocr == true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python3 - <<'PYCODE'
          import json,os,subprocess,sys
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          root=Path('/Users/samwall/alfred/builds/video-program-2026-09-23/v2')
          image=Image.new('RGB',(800,360),'white');draw=ImageDraw.Draw(image)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',56)
          draw.text((40,30),'METRO BANK',font=font,fill='black')
          draw.text((40,180),'CHECK THIS',font=font,fill='black')
          path=Path(os.environ['RUNNER_TEMP'])/'synthetic-ocr.png';image.save(path)
          p=subprocess.run([sys.executable,str(root/'kit/tools/ocr_tesseract_candidate.py'),str(path)],capture_output=True,text=True,check=True)
          result=json.loads(p.stdout);words=' '.join(row['text'].upper() for row in result['lines'])
          assert result['w']==800 and result['h']==360 and 'METRO' in words and 'BANK' in words and 'CHECK' in words
          assert all(row['w']>0 and row['h']>0 for row in result['lines'])
          print('Synthetic OCR functional test passed; real-media parity and production qualification remain required')
          PYCODE
