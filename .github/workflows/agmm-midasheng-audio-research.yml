name: Synthetic MiDasheng audio research
run-name: Synthetic MiDasheng audio research 20261031
on: workflow_dispatch
permissions: { contents: read }
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned CPU inference
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg libsndfile1
          python3 -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0
          python3 -m pip install --quiet 'transformers==4.57.6' 'huggingface_hub>=0.34,<1' 'numpy<3' soundfile accelerate pillow librosa soxr
          python3 - <<'INNER'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download('mispeech/midashenglm-0.6b-fp32',revision='3969e451d1c62618089c1135fe4c58ed33af2457',local_dir=os.path.join(os.environ['RUNNER_TEMP'],'midasheng'))
          INNER
      - name: Evaluate synthetic blind samples
        env:
          MIDASHENG_MODEL: ${{ runner.temp }}/midasheng
          OMP_NUM_THREADS: '4'
        run: python3 .github/scripts/midasheng-synthetic-audio-panel.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: midasheng-synthetic-audio-text-only
          path: ${{ runner.temp }}/midasheng-results.json
          if-no-files-found: warn
          retention-days: 7
