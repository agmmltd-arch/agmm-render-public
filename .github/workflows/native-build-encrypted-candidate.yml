name: AGMM encrypted native short package candidate
run-name: AGMM native build ${{ inputs.intent }}
on:
  workflow_dispatch:
    inputs:
      runtime_commit:
        description: Qualified commit behind its immutable agmm-native-runtime tag
        required: true
      id: { required: true, type: string }
      intent: { required: true, type: string }
      request_commit: { required: true, type: string }
      request_path: { required: true, type: string }
      request_blob: { required: true, type: string }
      request_sha256: { required: true, type: string }
permissions:
  contents: read
  actions: read
concurrency:
  group: agmm-native-build-${{ inputs.id }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'agmmltd-arch/agmm-render-public' && inputs.runtime_commit == '4bb43f3376955df547596fff3cd933cbdda93b67' && github.ref == 'refs/tags/agmm-native-build-private-4bb43f337695'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Europe/London
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.runtime_commit }}
          persist-credentials: false
      - name: Validate public request coordinates
        run: |
          python3 - <<'PYCODE'
          import json,os,re,subprocess
          i=json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']
          assert i['runtime_commit']=='4bb43f3376955df547596fff3cd933cbdda93b67'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==i['runtime_commit']
          assert os.environ['GITHUB_REF']=='refs/tags/agmm-native-build-private-4bb43f337695'
          assert re.fullmatch(r'[SC][0-9]{2,3}',i['id'])
          assert re.fullmatch(r'build-'+i['id']+r'-[a-f0-9]{64}',i['intent'])
          assert re.fullmatch(r'[a-f0-9]{40}',i['request_commit']) and re.fullmatch(r'[a-f0-9]{40}',i['request_blob'])
          assert re.fullmatch(r'[a-f0-9]{64}',i['request_sha256'])
          assert i['request_path']=='native-short-build-requests/'+i['id']+'-'+i['request_sha256']+'/request.json'
          PYCODE
      - name: Check out protected request metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.request_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-build-request
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ inputs.request_path }}
      - name: Validate exact immutable native build and owner intent
        id: binding
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          i=json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs'];root=Path('private-build-request')
          assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()==i['request_commit']
          path=root/i['request_path'];assert path.is_file() and not path.is_symlink() and path.stat().st_size<2000000
          assert subprocess.check_output(['git','-C',str(root),'hash-object',str(path.resolve())],text=True).strip()==i['request_blob']
          assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD:'+i['request_path']],text=True).strip()==i['request_blob']
          r=json.loads(path.read_text());assert r['id']==i['id'] and r['intent']==i['intent']
          assert hashlib.sha256(json.dumps(r,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()==i['request_sha256']
          Path('build-request.json').write_text(json.dumps(r,ensure_ascii=False))
          PYCODE
          python3 .github/scripts/build_native_short.py --request build-request.json --preflight
      - name: Check out exact protected current build inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ steps.binding.outputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-build-inputs
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.binding.outputs.private_prefix }}
      - name: Check out only new voice source metadata when a hosted voice is used
        if: steps.binding.outputs.voice_private_commit != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ steps.binding.outputs.voice_private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-voice-inputs
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ${{ steps.binding.outputs.voice_private_prefix }}/MANIFEST.json
            ${{ steps.binding.outputs.voice_private_prefix }}/shorts/scripts-v2/${{ inputs.id }}.md
            ${{ steps.binding.outputs.voice_private_prefix }}/shorts/voice/${{ inputs.id }}/paragraphs.txt
            ${{ steps.binding.outputs.voice_private_prefix }}/shorts/voice/${{ inputs.id }}/names.txt
            ${{ steps.binding.outputs.voice_private_prefix }}/shorts/voice/${{ inputs.id }}/source.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: Install the established Ubuntu package-build runtime
        run: |
          python3 -m pip install numpy==2.5.2 pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo mkdir -p /Users/samwall/alfred/builds
          sudo chown -R "$(id -u):$(id -g)" /Users/samwall
      - name: Run unchanged native source and sound build with provider access denied
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          python3 .github/scripts/build_native_short.py --request build-request.json \
            --private-root "$GITHUB_WORKSPACE/private-build-inputs" \
            --voice-private-root "$GITHUB_WORKSPACE/private-voice-inputs" \
            --work "$RUNNER_TEMP/native-build-work" --output "$RUNNER_TEMP/native-build-json"
      - name: Seal exact native inputs to an encrypted package
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python3 .github/scripts/hosted-youtube-candidate/native_build_seal_candidate.py \
            --request build-request.json --output "$RUNNER_TEMP/native-build-json" \
            --encrypted-output "$RUNNER_TEMP/native-build-input.enc"
      - name: Encrypt native build metadata
        if: always()
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          set -euo pipefail
          test -n "$VOICEFREE_PASS"
          mkdir -p "$RUNNER_TEMP/native-build-json" "$RUNNER_TEMP/encrypted-metadata"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/native-build-json.tar" native-build-json
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:VOICEFREE_PASS \
            -in "$RUNNER_TEMP/native-build-json.tar" -out "$RUNNER_TEMP/encrypted-metadata/metadata.enc"
          rm -f "$RUNNER_TEMP/native-build-json.tar"
      - name: Return encrypted native build input
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NATIVE-BUILD-INPUT-${{ github.run_id }}
          path: ${{ runner.temp }}/native-build-input.enc
          retention-days: 7
          if-no-files-found: error
      - name: Return encrypted native build metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NATIVE-BUILD-METADATA-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-metadata/metadata.enc
          retention-days: 7
          if-no-files-found: warn
