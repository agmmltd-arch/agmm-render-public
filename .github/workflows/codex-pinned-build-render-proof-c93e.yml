name: Isolated renderer recovery proof
run-name: Isolated renderer recovery c93ea4b9
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 00762f35505d51ea41098977e9658bc8e6cb724d
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c93ea4b94d71c23c9609a5b13bfe4bf5478ceacc
          path: workflow-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 44edcc3fc0de6cc08657af9e3d1787087661c427
          path: builder-workflow-source
          persist-credentials: false
      - name: Verify immutable closure and producer binding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 00762f35505d51ea41098977e9658bc8e6cb724d
          test "$(git -C workflow-source rev-parse HEAD)" = c93ea4b94d71c23c9609a5b13bfe4bf5478ceacc
          PYTHONPATH=.github/scripts python3 - <<'PY'
          import voice_hosted
          from pathlib import Path
          voice_hosted.source_closure()
          s=Path('workflow-source/.github/workflows/protected-short-render-candidate.yml').read_text()
          assert "inputs.runtime_commit == '00762f35505d51ea41098977e9658bc8e6cb724d'" in s
          assert 'gh release download' not in s and 'path: exact-input/' not in s
          for part in ('prepare', 'cap-part', 'verify-part', 'assemble'):
              assert 'render_short_package.py '+part in s
          assert s.count('sealed_render_artifact.py seal') >= 2
          assert s.count('ref: $'+'{{ inputs.runtime_commit }}') == 3
          assert 'env -u VOICEFREE_PASS npx' in s and 'env -u VOICEFREE_PASS python3 static_check.py' in s
          b=Path('builder-workflow-source/.github/workflows/native-build-encrypted-candidate.yml').read_text()
          assert "inputs.runtime_commit == '4bb43f3376955df547596fff3cd933cbdda93b67'" in b
          assert "github.ref == 'refs/tags/agmm-native-build-recovery-4bb43f337695'" in b
          assert 'ref: $'+'{{ inputs.runtime_commit }}' in b
          assert '44edcc3fc0de6cc08657af9e3d1787087661c427' in Path('.github/scripts/hosted-youtube-candidate/verify_build_producer.py').read_text()
          PY
          cd .github/scripts/hosted-youtube-candidate
          PYTHONPATH=.. python3 -m unittest -v test_verify_build_producer.py test_native_build_seal_candidate.py
          echo 'Synthetic proof only; no real build, render, approval or post.'
