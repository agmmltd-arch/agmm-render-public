name: AGMM short DOM lint
run-name: AGMM short DOM lint ${{ inputs.tag }}

# DOM-level lint facts for a short's own built package (kit/tools/dom_lint.py, backend "actions"). Sibling of agmm-short-snap.yml:
# the same release asset (package only, secret-scanned by the dispatching tool), the same hash check, the same plan format.
# Instead of JPG frames it seeks each part's own GSAP timeline in headless Chrome and writes ONE JSON of facts (text boxes,
# opacity, font px, painted elements) per sample time. Mechanical only: it cannot render a video, approve, arm or publish anything.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag holding exactly one asset, source.tar.gz
        required: true
      source_sha256:
        description: Exact SHA256 of source.tar.gz
        required: true
      tag:
        description: Unique safe label used for run title, concurrency and artifact name
        required: true
      plan:
        description: 'JSON list of {"look": "...", "part": "...", "times": [seconds, ...]} jobs'
        required: true
      profile:
        description: 'JSON {"visible": {x0,y0,x1,y1}, "overlays": [...]}: only picks which texts get the occlusion probe'
        required: false
        default: '{}'

permissions:
  contents: read

concurrency:
  group: agmm-short-domlint-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  domlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      TAG: ${{ inputs.tag }}
      PLAN: ${{ inputs.plan }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/snap_short_package.py
            .github/scripts/render_short_package.py
            .github/scripts/dom_lint_runner.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce
        id: chrome
        with:
          chrome-version: stable
      - name: Validate labels, download and verify the exact package, validate the plan
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '[.assets[].name] | sort | join(",")')"
          test "$assets" = "source.tar.gz"
          mkdir exact-input
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p source.tar.gz -D exact-input
          python3 .github/scripts/snap_short_package.py prepare \
            --source exact-input/source.tar.gz --source-sha256 "$SOURCE_SHA256" \
            --plan "$PLAN" --output prepared
          printf '%s' "$PROFILE" > profile.json
          python3 -c "import json; json.load(open('profile.json'))"
      - name: Install puppeteer-core (the browser is the runner's own Chrome)
        run: npm install --no-audit --no-fund --no-save puppeteer-core@25.12.0
      - name: Seek every part's timeline and record the DOM facts
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          mkdir -p result
          node .github/scripts/dom_lint_runner.mjs --root prepared/project --plan prepared/PLAN.json \
            --out result/raw.json --chrome "$CHROME_PATH" --profile profile.json
      - name: Upload the facts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.tag }}-DOMLINT
          path: result/raw.json
          retention-days: 1
          if-no-files-found: error
