name: AGMM verified hosted film preview export
on:
  workflow_run:
    workflows: [AGMM film segments render]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag:
        required: true
      fid:
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: film-preview-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  export:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 37114306772 && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      TAG: ${{ inputs.tag || 'F02-root-hosted-full-20261003-0950' }}
      FID: ${{ inputs.fid || 'F02' }}
    steps:
      - name: Verify source workflow before any artifact download
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPO" == agmmltd-arch/agmm-render-public ]]
          [[ "$RUN_ID" =~ ^[0-9]{8,20}$ && "$FID" =~ ^F[0-9]{2}$ && "$TAG" =~ ^[A-Za-z0-9._-]{1,120}$ ]]
          gh api "repos/$REPO/actions/runs/$RUN_ID" > source-run.json
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > source-jobs.json
          python3 - <<'PYCODE'
          import json,os,sys
          from pathlib import Path
          assert sys.platform.startswith('linux') and os.environ.get('GITHUB_ACTIONS')=='true'
          assert os.environ['TAG'].startswith(os.environ['FID']+'-')
          d=json.loads(Path('source-run.json').read_text())
          assert d['id']==int(os.environ['RUN_ID']) and d['repository']['full_name']==os.environ['REPO']
          assert d['path']=='.github/workflows/agmm-film.yml' and d['event']=='workflow_dispatch'
          assert d['status']=='completed' and d['conclusion'] in ('success','failure')
          if d['conclusion']=='failure':
              jobs=json.loads(Path('source-jobs.json').read_text())
              assert jobs['total_count']==len(jobs['jobs']) and jobs['jobs']
              assert all(j['run_id']==d['id'] and j['status']=='completed' for j in jobs['jobs'])
              assert any(j['name']=='assemble' and j['conclusion']=='success' for j in jobs['jobs'])
              assert all(j['conclusion']=='success' for j in jobs['jobs'] if j['name']!='macos-ocr')
              assert any(j['name']=='macos-ocr' and j['conclusion']=='failure' for j in jobs['jobs'])
          assert d['display_title']=='AGMM film '+os.environ['TAG']
          PYCODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.tag || 'F02-root-hosted-full-20261003-0950' }}-MASTER-4K
          path: master
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.tag || 'F02-root-hosted-full-20261003-0950' }}-REVIEW-1080
          path: review
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.tag || 'F02-root-hosted-full-20261003-0950' }}-MACOS-VISION-OCR
          path: ocr
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify exact mechanical outputs and publish a preview without approval
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,os,re,subprocess,sys
          from pathlib import Path
          assert sys.platform.startswith('linux') and os.environ.get('GITHUB_ACTIONS')=='true'
          fid=os.environ['FID'];repo=os.environ['REPO'];rid=os.environ['RUN_ID'];tag='preview-'+fid+'-'+rid
          report=json.loads(Path('master/REMOTE-INTEGRITY.json').read_text())
          assert report==json.loads(Path('review/REMOTE-INTEGRITY.json').read_text())
          assert report['kind']=='mechanical_integrity_only' and report['editorial_gate']=='NOT_RUN' and report['release_approval']=='NOT_GRANTED'
          required={'segment_decode','segment_flicker','master_full_decode','derived_full_decode','encoded_audio_loudness_and_true_peak'}
          assert required<=set(report['checks']) and all(report['checks'][k]=='PASS' for k in required)
          ocr=json.loads(Path('ocr/OCR-CHECK-2.json').read_text())
          assert ocr['kind']=='existing_gate_check_only' and ocr['release_approval']=='NOT_GRANTED'
          assert ocr['check']['status'] in ('PASS','FAIL')
          sums={}
          for line in Path('master/SHA256SUMS.txt').read_text().splitlines():
              sha,name=line.split('  ',1)
              assert re.fullmatch('[a-f0-9]{64}',sha) and name not in sums
              sums[name]=sha
          assert Path('master/SHA256SUMS.txt').read_bytes()==Path('review/SHA256SUMS.txt').read_bytes()
          outputs=report['outputs'];files=[]
          for folder,name,sizekey in [('master',fid+'-MASTER-4K.mp4','master_bytes'),('review',fid+'-MASTER-1080-from-4K.mp4','derived_bytes')]:
              p=Path(folder)/name;size=outputs[sizekey]
              assert type(size) is int and 0<size<(20000000000 if folder=='master' else 2000000000) and p.stat().st_size==size
              h=hashlib.sha256()
              with p.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(1048576),b''):h.update(chunk)
              assert h.hexdigest()==sums[name]
              files.append({'name':name,'sha256':h.hexdigest(),'size':size,'path':str(p)})
          def split_for_release(source, directory, limit=1500000000):
              assert type(limit) is int and 0<limit<2000000000
              directory.mkdir(exist_ok=True)
              parts=[];whole=hashlib.sha256();total=0
              with source.open('rb') as stream:
                  index=1
                  while True:
                      first=stream.read(min(1048576,limit))
                      if not first: break
                      target=directory/(source.name+'.part'+str(index).zfill(4))
                      size=0;digest=hashlib.sha256()
                      with target.open('wb') as out:
                          chunk=first
                          while chunk:
                              out.write(chunk);digest.update(chunk);whole.update(chunk);size+=len(chunk);total+=len(chunk)
                              if size==limit: break
                              chunk=stream.read(min(1048576,limit-size))
                      parts.append({'name':target.name,'sha256':digest.hexdigest(),'size':size,'path':str(target)})
                      index+=1
              return parts,whole.hexdigest(),total
          master_parts=None
          if files[0]['size']>=2000000000:
              original=files[0]
              parts,combined_sha,total=split_for_release(Path(original['path']),Path('master-parts'))
              assert combined_sha==original['sha256'] and total==original['size'] and len(parts)>1
              master_parts={k:original[k] for k in ('name','size','sha256')}
              master_parts['parts']=[p['name'] for p in parts]
              master_parts['reassembly']='Concatenate listed parts in order on a hosted runner; verify size and SHA256 before use. No re-encoding.'
              files=parts+[files[1]]
          exists=subprocess.run(['gh','release','view',tag,'-R',repo],capture_output=True)
          if exists.returncode:
              subprocess.run(['gh','release','create',tag,'-R',repo,'--target',json.loads(Path('source-run.json').read_text())['head_sha'],'--title',fid+' review preview','--notes','Hosted mechanical verification complete. Independent audiovisual, editorial and thumbnail review pending. NOT RELEASE APPROVED.'],check=True)
          release=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/tags/'+tag]))
          assets={a['name']:a for a in release['assets']}
          for f in files:
              if f['name'] in assets:
                  a=assets[f['name']];assert a['size']==f['size'] and a.get('digest')=='sha256:'+f['sha256'],'existing asset differs; no overwrite'
              else:subprocess.run(['gh','release','upload',tag,f['path'],'-R',repo],check=True)
              f.pop('path')
          published=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/tags/'+tag]))
          assets={a['name']:a for a in published['assets']}
          for f in files:
              a=assets[f['name']]
              assert a['size']==f['size'] and a.get('digest')=='sha256:'+f['sha256']
              f['url']=a['browser_download_url']
              assert f['url']=='https://github.com/'+repo+'/releases/download/'+tag+'/'+f['name']
          Path('receipts').mkdir()
          receipt={'source_run_id':int(rid),'repository':repo,'source_workflow_commit':json.loads(Path('source-run.json').read_text())['head_sha'],'files':files,'integrity':report,'ocr':json.loads(Path('ocr/OCR-CHECK-2.json').read_text()),'review_status':'NOT_RUN','release_approval':'NOT_GRANTED'}
          receipt.update(source_conclusion=json.loads(Path('source-run.json').read_text())['conclusion'],
                         preview_status='REVIEW_PENDING' if ocr['check']['status']=='PASS' else 'REPAIRS_REQUIRED')
          if master_parts is not None:
              receipt.update(schema_version=2,master=master_parts)
          Path('receipts/HOSTED-PREVIEW.json').write_text(json.dumps(receipt,indent=2))
          # Small metadata only: enables library discovery without Mac media transfer.
          import base64
          dest='repos/'+repo+'/contents/status/'+fid+'-preview.json'
          prior=subprocess.run(['gh','api',dest],capture_output=True,text=True)
          payload={'message':'Publish verified '+fid+' preview metadata, no approval','content':base64.b64encode(json.dumps(receipt).encode()).decode()}
          if prior.returncode==0:payload['sha']=json.loads(prior.stdout)['sha']
          Path('preview-payload.json').write_text(json.dumps(payload))
          subprocess.run(['gh','api','--method','PUT',dest,'--input','preview-payload.json'],check=True,stdout=subprocess.DEVNULL)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.fid || 'F02' }}-${{ inputs.run_id || github.event.workflow_run.id }}-TEXT-RECEIPT
          path: receipts/HOSTED-PREVIEW.json
          if-no-files-found: error
          retention-days: 7
