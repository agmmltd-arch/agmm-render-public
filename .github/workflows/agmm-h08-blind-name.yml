name: AGMM H08 blind name listener
run-name: H08 blind name take ${{ inputs.take }}
on:
  workflow_dispatch:
    inputs:
      take: { description: Take number, required: true }
      start: { description: Clip start seconds, required: true }
      end: { description: Clip end seconds, required: true }
      voice_run: { description: Encrypted voice run, required: false, default: '40679977245' }
      voice_label: { description: Voice pack label, required: false, default: H08-agmfix28 }
      para: { description: Paragraph key, required: false, default: P6 }
permissions:
  contents: read
  actions: read
jobs:
  listen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAKE: ${{ inputs.take }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      VOICE_RUN: ${{ inputs.voice_run }}
      VOICE_LABEL: ${{ inputs.voice_label }}
      PARA: ${{ inputs.para }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/hailmary-h08-blind-name.py
          sparse-checkout-cone-mode: false
      - name: Fetch candidate and hear its name
        env:
          GH_TOKEN: ${{ github.token }}
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$TAKE" =~ ^([1-9]|10)$ && "$START" =~ ^[0-9]+(\.[0-9]+)?$ && "$END" =~ ^[0-9]+(\.[0-9]+)?$ ]]
          [[ "$VOICE_RUN" =~ ^[0-9]+$ && "$VOICE_LABEL" =~ ^[A-Za-z0-9-]+$ && "$PARA" =~ ^P[1-8]$ ]]
          gh run download "$VOICE_RUN" -R "$GITHUB_REPOSITORY" -n "voicefree-chatterbox-$VOICE_LABEL-ENC" -D "$RUNNER_TEMP/vpack"
          mkdir -p voice
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICEFREE_PASS -in "$RUNNER_TEMP/vpack/synth-pack.enc" | tar -x -C voice
          python3 -m pip install --quiet imageio-ffmpeg==0.6.0
          python3 .github/scripts/hailmary-h08-blind-name.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: H08-blind-name-${{ inputs.take }}
          path: out/blind.json
          retention-days: 7
          if-no-files-found: warn
