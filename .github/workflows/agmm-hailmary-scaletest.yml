name: AGMM hailmary scale test
run-name: AGMM hailmary scale test ${{ inputs.label }}
# Temporary (26 Oct 2026): cost of a 2x device scale vs 1x for a crowd range and Alfred ranges, one runner each. No media is committed here.
on:
  workflow_dispatch:
    inputs:
      private_commit: { description: 40-hex commit of agmm-video-render, required: true }
      project_path: { description: film folder inside that commit, required: true }
      label: { description: short label, required: true }
permissions:
  contents: read
jobs:
  t:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: crowd-1x, range: '16-16.5', scale: 1 }
          - { name: crowd-2x, range: '16-16.5', scale: 2 }
          - { name: reveal-1x, range: '24.4-24.9', scale: 1 }
          - { name: reveal-2x, range: '24.4-24.9', scale: 2 }
          - { name: alfred-1x, range: '30-30.5', scale: 1 }
          - { name: alfred-2x, range: '30-30.5', scale: 2 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            ${{ inputs.project_path }}
      - name: Runtime (static ffmpeg, Node 22)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 4 https://nodejs.org/dist/v22.12.0/node-v22.12.0-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v22.12.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Render
        run: |
          set -uo pipefail
          cp -r "private/${{ inputs.project_path }}" film
          cd film; python3 fetch_3d.py | tail -2
          nproc; free -g | head -2
          mkdir -p ../out
          S0=$(date +%s.%N)
          timeout 3000 npx -y openfilm@0.2.5 render "${{ matrix.range }}" --scale ${{ matrix.scale }} --out ../out/${{ matrix.name }}.mp4 2>&1 | while IFS= read -r l; do echo "$(date +%s.%N) $l"; done | tee ../out/${{ matrix.name }}.log
          S1=$(date +%s.%N)
          echo "WALL $(python3 -c "print($S1-$S0)")" | tee -a ../out/${{ matrix.name }}.log
          ffprobe -v error -select_streams v -show_entries stream=width,height,nb_frames,profile,level -of csv=p=0 ../out/${{ matrix.name }}.mp4 | tee -a ../out/${{ matrix.name }}.log
          ffmpeg -nostdin -y -loglevel error -i ../out/${{ matrix.name }}.mp4 -vf "select=eq(n\,7)" -frames:v 1 ../out/${{ matrix.name }}-frame.png
          ls -la ../out
      - name: Share-copy comparison (2x only)
        if: matrix.scale == 2
        run: |
          set -uo pipefail
          mkdir -p cmp
          N=out/${{ matrix.name }}
          ffmpeg -nostdin -y -loglevel error -i $N.mp4 -vf scale=1080:1920:flags=lanczos -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p cmp/ref1080.mp4
          ffmpeg -nostdin -y -loglevel error -i $N.mp4 -vf scale=1080:1920:flags=lanczos -c:v libx264 -preset slow -crf 24 -maxrate 4.5M -bufsize 9M -pix_fmt yuv420p cmp/shareA.mp4
          ffmpeg -nostdin -y -loglevel error -i $N.mp4 -c:v libx264 -preset slow -crf 26 -maxrate 4.5M -bufsize 9M -pix_fmt yuv420p cmp/shareB.mp4
          ls -la cmp | tee -a $N.log
          for v in shareA shareB; do
            ffmpeg -nostdin -i cmp/$v.mp4 -i cmp/ref1080.mp4 -lavfi "[0:v]scale=1080:1920:flags=lanczos[a];[a][1:v]ssim" -f null - 2>&1 | grep -o "All:[0-9.]*" | sed "s/^/$v ssim /" | tee -a $N.log
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scaletest-${{ inputs.label }}-${{ matrix.name }}
          path: out
          retention-days: 3
