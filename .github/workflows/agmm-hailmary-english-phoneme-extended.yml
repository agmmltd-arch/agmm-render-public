name: Hail Mary English phoneme extended controls
run-name: English phoneme recognizer calibration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: ['slplab/wav2vec2-large-robust-L2-english-phoneme-recognition']
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - name: Compare correct and incorrect synthetic pronunciation
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python3 -m pip install --quiet 'transformers==4.48.3' 'torch==2.5.1' 'soundfile==0.13.1' 'protobuf' 'sentencepiece' 'phonemizer' --extra-index-url https://download.pytorch.org/whl/cpu
          for voice in en-gb en-us en-sc; do
            for speed in 130 170 200; do
              for kind in good bad; do
                if [ "$kind" = good ]; then phrase='an [[eI aI]] consultancy'; else phrase='an [[aI aI]] consultancy'; fi
                file="${voice}-${speed}-${kind}"
                espeak-ng -v "$voice" -s "$speed" -w "$file.wav" "$phrase"
                ffmpeg -nostdin -y -v error -i "$file.wav" -ar 16000 -ac 1 "${file}16.wav"
              done
            done
          done
          python3 - <<'PY'
          import os,soundfile as sf,torch
          from transformers import AutoProcessor,AutoModelForCTC
          name=os.environ['MODEL'];print('MODEL',name,flush=True)
          processor=AutoProcessor.from_pretrained(name)
          model=AutoModelForCTC.from_pretrained(name).eval()
          for f in [f'{voice}-{speed}-{kind}' for voice in ('en-gb','en-us','en-sc') for speed in (130,170,200) for kind in ('good','bad')]:
              audio,sr=sf.read(f+'16.wav')
              inputs=processor(audio,sampling_rate=sr,return_tensors='pt').input_values
              with torch.no_grad(): ids=torch.argmax(model(inputs).logits,dim=-1)
              print('CONTROL',f,processor.batch_decode(ids)[0],flush=True)
          PY
