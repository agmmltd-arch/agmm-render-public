name: Protected voice archive key synthetic proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Push and verify synthetic text in private storage
        env:
          AGMM_VOICE_ARCHIVE_DEPLOY_KEY: ${{ secrets.AGMM_VOICE_ARCHIVE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$AGMM_VOICE_ARCHIVE_DEPLOY_KEY"
          printf '%s\n' "$AGMM_VOICE_ARCHIVE_DEPLOY_KEY" > "$RUNNER_TEMP/key"
          unset AGMM_VOICE_ARCHIVE_DEPLOY_KEY
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          mkdir "$RUNNER_TEMP/synthetic" && cd "$RUNNER_TEMP/synthetic"
          git init -q
          git config user.name 'AGMM archive proof'
          git config user.email 'actions@users.noreply.github.com'
          printf 'synthetic non-media proof\n' > proof.txt
          git add proof.txt && git commit -qm 'Synthetic protected archive proof'
          commit="$(git rev-parse HEAD)"
          branch="voice-archive-synthetic-${GITHUB_RUN_ID}"
          git push -q git@github.com:agmmltd-arch/agmm-video-render.git "$commit:refs/heads/$branch"
          remote="$(git ls-remote --heads git@github.com:agmmltd-arch/agmm-video-render.git "refs/heads/$branch" | cut -f1)"
          test "$remote" = "$commit"
          echo "SYNTHETIC_PRIVATE_ARCHIVE_PROOF $branch $commit"
