name: F08 Wave06 pinned hosted preview export

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: f08-wave06-preview-export-37213603867
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.repository == 'agmmltd-arch/agmm-render-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the reviewed exporter revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize runner-only export path
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "agmmltd-arch/agmm-render-public"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTIONS" = true
          mkdir -p "$RUNNER_TEMP/f08-wave06-preview"
          printf 'WORKROOT=%s/f08-wave06-preview\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Run exporter contract tests before external writes
        run: python3 -m unittest discover -s .github/scripts -p 'test_f08_preview_export.py' -v

      - name: Bind exact successful public render and expiring artifact before transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKROOT"
          gh api "repos/$GITHUB_REPOSITORY" > "$WORKROOT/repository.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37213603867" > "$WORKROOT/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37213603867/jobs?per_page=100" > "$WORKROOT/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37213603867/artifacts?per_page=100" > "$WORKROOT/artifacts.json"
          python3 .github/scripts/f08_preview_export.py validate-source \
            --repository "$WORKROOT/repository.json" --run "$WORKROOT/run.json" \
            --jobs "$WORKROOT/jobs.json" --artifacts "$WORKROOT/artifacts.json" \
            --out "$WORKROOT/validated-source.json"

      - name: Check hosted disk headroom before exact artifact transfer
        run: python3 .github/scripts/f08_preview_export.py check-capacity --minimum-bytes 1000000000

      - name: Download exact native artifact ZIP and verify its digest before extraction
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11308040079/zip" > "$WORKROOT/source-artifact.zip"
          python3 .github/scripts/f08_preview_export.py extract-artifact \
            --archive "$WORKROOT/source-artifact.zip" --source "$WORKROOT/validated-source.json" \
            --out-dir "$WORKROOT/source-artifact"

      - name: Verify exact proof files and stage a bounded review-only preview
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/f08_preview_export.py prepare \
            --download-dir "$WORKROOT/source-artifact" \
            --source "$WORKROOT/validated-source.json" \
            --out-dir "$WORKROOT/release-payload"

      - name: Create or verify the immutable review-only preview release
        shell: bash
        run: python3 .github/scripts/f08_preview_export.py publish --export-dir "$WORKROOT/release-payload"
