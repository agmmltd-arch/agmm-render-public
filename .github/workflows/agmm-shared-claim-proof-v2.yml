name: Synthetic shared publishing claim proof v2
run-name: Synthetic shared publishing claim proof v2 20261031
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Test synthetic global claims and GitHub race
        working-directory: .github/scripts/shared-claim-proof-v2
        run: |
          set -euo pipefail
          python3 -m unittest -q test_shared_claim_candidate
          python3 test_hosted_shared_race.py
