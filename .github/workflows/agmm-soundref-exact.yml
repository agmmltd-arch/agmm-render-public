name: AGMM soundref exact
run-name: AGMM soundref exact ${{ inputs.label }}
# Exact non-voice stem and per-clip levels of our v6 ad, rendered from mix.json with the project's own mix.py. Private repo via the read-only deploy key.
on:
  workflow_dispatch:
    inputs:
      private_commit: { description: 40-hex commit of agmm-video-render holding hailmary/soundref-exact, required: true }
      label: { description: short label, required: true }
permissions:
  contents: read
jobs:
  exact:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            hailmary/soundref-exact
      - name: Runtime (static ffmpeg, no apt)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          python3 -m pip install --quiet --retries 4 numpy scipy soundfile
      - name: Render stems and clips
        run: |
          set -euo pipefail
          cd private/hailmary/soundref-exact
          python3 exact_ours.py
          cp -r out "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soundref-exact-${{ inputs.label }}
          path: out
          retention-days: 7
