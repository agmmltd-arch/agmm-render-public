name: AGMM soundref v2
run-name: AGMM soundref v2 ${{ inputs.label }}
# Measure v2 sound against spec (26 Oct 2026): demucs/CLAP levels on SHARE.mp4 and an exact per-clip render from mix.json. Private repo via the read-only deploy key.
on:
  workflow_dispatch:
    inputs:
      private_commit: { description: 40-hex commit of agmm-video-render holding hailmary/soundref-v2, required: true }
      label: { description: short label, required: true }
permissions:
  contents: read
jobs:
  demucs:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            hailmary/soundref-v2
      - name: Runtime (static ffmpeg, no apt)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - name: Python deps
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"; . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet --retries 4 "numpy<2" scipy soundfile matplotlib
          pip install --quiet --retries 4 torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet --retries 4 demucs==4.0.1 "transformers==4.46.3" "numpy<2"
      - name: Analyse
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/venv/bin/activate"
          python private/hailmary/soundref-v2/analyze.py private/hailmary/soundref-v2/v2.mp4 v2 out 2>&1 | grep -v Warning | tail -40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soundref-v2-${{ inputs.label }}-demucs
          path: out
          retention-days: 7
  exact:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            hailmary/soundref-v2
      - name: Runtime
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          python3 -m pip install --quiet --retries 4 numpy scipy soundfile
      - name: Render stems and clips
        run: |
          set -euo pipefail
          cd private/hailmary/soundref-v2/exact
          python3 exact_ours.py
          cp -r out "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soundref-v2-${{ inputs.label }}-exact
          path: out
          retention-days: 7
