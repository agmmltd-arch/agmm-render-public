name: AGMM Hail Mary pronunciation listener
run-name: Hail Mary pronunciation listener ${{ inputs.film }}
on:
  workflow_dispatch:
    inputs:
      film: { description: Film ID, required: true }
      render_run: { description: Source render run ID, required: true }
      render_label: { description: Source render label, required: true }
permissions:
  contents: read
  actions: read
jobs:
  listen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FILM: ${{ inputs.film }}
      RENDER_RUN: ${{ inputs.render_run }}
      RENDER_LABEL: ${{ inputs.render_label }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/hailmary-pronunciation-listen.py
          sparse-checkout-cone-mode: false
      - name: Validate and fetch exact hosted mix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$FILM" =~ ^H(0[2-9]|1[01])$ ]]
          [[ "$RENDER_RUN" =~ ^[0-9]+$ ]]
          [[ "$RENDER_LABEL" =~ ^H(0[2-9]|1[01])-v4[cd]$ ]]
          gh run download "$RENDER_RUN" -R "$GITHUB_REPOSITORY" -n "hailmary-$RENDER_LABEL" -D input
          test -s input/gate-input/mix.wav
      - name: Listen to the complete final mix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -m pip install --quiet imageio-ffmpeg==0.6.0
          python3 .github/scripts/hailmary-pronunciation-listen.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pronunciation-${{ inputs.film }}
          path: out/listen.json
          retention-days: 7
          if-no-files-found: warn
