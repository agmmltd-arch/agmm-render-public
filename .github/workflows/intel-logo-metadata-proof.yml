name: Inspect protected Intel asset metadata
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify producer and extract only public source metadata
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,io,json,os,subprocess,tarfile,zipfile
          repo='agmmltd-arch/agmm-render-public';runid=41122956665;aid=13010140030
          def api(p): return json.loads(subprocess.check_output(['gh','api','repos/'+repo+p]))
          run=api('/actions/runs/'+str(runid));assert run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1 and run['event']=='workflow_dispatch' and run['head_sha']=='4fd75cfe967de30bc0c3f71fa92542510b6f1385' and run['path']=='.github/workflows/intel-licensed-logo-proof.yml'
          a=api('/actions/artifacts/'+str(aid));assert not a['expired'] and a['name']=='intel-logo-source-ENC' and a['workflow_run']['id']==runid
          raw=subprocess.check_output(['gh','api','repos/'+repo+'/actions/artifacts/'+str(aid)+'/zip']);assert a['digest']=='sha256:'+hashlib.sha256(raw).hexdigest()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.namelist()==['intel-asset.enc'];data=z.read('intel-asset.enc')
          plain=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-pbkdf2','-pass','env:VOICEFREE_PASS'],input=data,capture_output=True,check=True).stdout
          with tarfile.open(fileobj=io.BytesIO(plain)) as t:
              names=t.getnames();assert len(names)==2 and 'intel.json' in names and all(m.isfile() for m in t.getmembers());assert any(n.startswith('intel-logo.') for n in names)
              j=json.load(t.extractfile('intel.json'));assert j['name']=='Intel' and j.get('file') and j.get('licence') and j.get('commons')
              print(json.dumps({'producer_run':runid,'asset_artifact':aid,'name':j['name'],'commons':j['commons'],'licence':j['licence'],'licence_url':j.get('licence_url'),'author':j.get('author'),'restrictions':j.get('restrictions'),'review_approved':False},sort_keys=True))
          PYCODE
