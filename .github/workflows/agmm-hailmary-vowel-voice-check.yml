name: AGMM voice vowel spot check
run-name: Voice vowel check ${{ inputs.film }}
on:
  workflow_dispatch:
    inputs:
      film: { description: Film ID, required: true }
      voice_run: { description: Voice pack run ID, required: true }
      voice_label: { description: Voice pack label, required: true }
      take: { description: Take number, required: true }
permissions:
  contents: read
  actions: read
jobs:
  listen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FILM: ${{ inputs.film }}
      VOICE_RUN: ${{ inputs.voice_run }}
      VOICE_LABEL: ${{ inputs.voice_label }}
      TAKE: ${{ inputs.take }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/hailmary-vowel-probe.py
          sparse-checkout-cone-mode: false
      - name: Hear bounded vowel samples
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          set -euo pipefail
          [[ "$FILM" =~ ^H(0[2-9]|1[01])$ && "$VOICE_RUN" =~ ^[0-9]+$ && "$VOICE_LABEL" =~ ^[A-Za-z0-9-]+$ && "$TAKE" =~ ^[1-5]$ ]]
          gh run download "$VOICE_RUN" -R "$GITHUB_REPOSITORY" -n "voicefree-chatterbox-$VOICE_LABEL-ENC" -D "$RUNNER_TEMP/vpack"
          mkdir voice
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICEFREE_PASS -in "$RUNNER_TEMP/vpack/synth-pack.enc" | tar -x -C voice
          python3 -m pip install --quiet imageio-ffmpeg==0.6.0
          for start in 0.10 0.20 0.30 0.40 0.50 0.60 0.70; do
            end=$(python3 -c "print(float('$start')+0.25)")
            echo "WINDOW $start"; SOURCE="voice/P6.t$TAKE.wav" START="$start" END="$end" python3 .github/scripts/hailmary-vowel-probe.py || true
          done
