name: Isolated private builder dependents proof
run-name: Isolated private builder dependents eba9dff8-v2
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 717c4461d02891ffe6b2e9fade808626be3c7263
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 77860117ab1cb32e2ec6af7bbe927995f37779c1
          path: render-workflow
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 742942c520d916a323258415e71db7e3c9cff308
          path: metadata-runtime
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d1a8b3ea08440df0e1d0c996263fd6209e895aa8
          path: metadata-workflow
          persist-credentials: false
      - name: Verify pinned private-builder dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 717c4461d02891ffe6b2e9fade808626be3c7263
          test "$(git -C render-workflow rev-parse HEAD)" = 77860117ab1cb32e2ec6af7bbe927995f37779c1
          test "$(git -C metadata-runtime rev-parse HEAD)" = 742942c520d916a323258415e71db7e3c9cff308
          test "$(git -C metadata-workflow rev-parse HEAD)" = d1a8b3ea08440df0e1d0c996263fd6209e895aa8
          PYTHONPATH=.github/scripts python3 -c 'import voice_hosted; voice_hosted.source_closure()'
          (cd metadata-runtime && PYTHONPATH=.github/scripts python3 -c 'import voice_hosted; voice_hosted.source_closure()')
          python3 - <<'PYCODE'
          from pathlib import Path
          render=Path('render-workflow/.github/workflows/protected-short-render-candidate.yml').read_text()
          meta=Path('metadata-workflow/.github/workflows/hosted-build-metadata-candidate.yml').read_text()
          assert "inputs.runtime_commit == '717c4461d02891ffe6b2e9fade808626be3c7263'" in render
          assert 'ref: 742942c520d916a323258415e71db7e3c9cff308' in meta
          for root in (Path('.'),Path('metadata-runtime')):
              p=root/'.github/scripts/hosted-youtube-candidate/verify_build_producer.py'
              assert "ALLOWED_RUNTIME={'eba9dff89f1c06e232f948d07e45601f019b1fa1'}" in p.read_text()
          assert "commit = 'eba9dff89f1c06e232f948d07e45601f019b1fa1'" in Path('metadata-runtime/.github/scripts/hosted-youtube-candidate/extract_build_metadata_candidate.py').read_text()
          PYCODE
          (cd .github/scripts/hosted-youtube-candidate && PYTHONPATH=.. python3 -m unittest -v test_verify_build_producer.py test_native_build_seal_candidate.py)
          (cd metadata-runtime/.github/scripts/hosted-youtube-candidate && PYTHONPATH=.. python3 -m unittest -v test_verify_build_producer.py test_extract_build_metadata_candidate.py)
          echo 'Synthetic source proof only; no production video or approval.'
