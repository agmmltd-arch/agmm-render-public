name: Hail Mary English phoneme control
run-name: English phoneme recognizer calibration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: ['slplab/wav2vec2-large-robust-L2-english-phoneme-recognition','MultiBridge/wav2vec-LnNor-IPA-ft']
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - name: Compare correct and incorrect synthetic pronunciation
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python3 -m pip install --quiet 'transformers==4.48.3' 'torch==2.5.1' 'soundfile==0.13.1' 'protobuf' 'sentencepiece' 'phonemizer' --extra-index-url https://download.pytorch.org/whl/cpu
          espeak-ng -v en-gb -s 150 -w day.wav '[[eI]]'
          espeak-ng -v en-gb -s 150 -w my.wav '[[aI]]'
          espeak-ng -v en-gb -s 150 -w good.wav 'an [[eI aI]] consultancy'
          espeak-ng -v en-gb -s 150 -w bad.wav 'an [[aI aI]] consultancy'
          espeak-ng -v en-gb -s 150 -w today.wav 'Say day again'
          espeak-ng -v en-gb -s 150 -w tomy.wav 'Say my again'
          for f in day my good bad today tomy; do ffmpeg -nostdin -y -v error -i "$f.wav" -ar 16000 -ac 1 "${f}16.wav"; done
          python3 - <<'PY'
          import os,soundfile as sf,torch
          from transformers import AutoProcessor,AutoModelForCTC
          name=os.environ['MODEL'];print('MODEL',name,flush=True)
          processor=AutoProcessor.from_pretrained(name)
          model=AutoModelForCTC.from_pretrained(name).eval()
          for f in ['day','my','good','bad','today','tomy']:
              audio,sr=sf.read(f+'16.wav')
              inputs=processor(audio,sampling_rate=sr,return_tensors='pt').input_values
              with torch.no_grad(): ids=torch.argmax(model(inputs).logits,dim=-1)
              print('CONTROL',f,processor.batch_decode(ids)[0],flush=True)
          PY
