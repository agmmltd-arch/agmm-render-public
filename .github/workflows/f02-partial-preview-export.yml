name: F02 pinned hosted preview export (mechanical only)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: f02-preview-export-37201156544
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.repository == 'agmmltd-arch/agmm-render-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '37201156544'
      SOURCE_MASTER_ARTIFACT_ID: '11303303946'
      SOURCE_REVIEW_ARTIFACT_ID: '11303109540'
    steps:
      - name: Check out this export proposal revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch and validate exact completed source metadata before artifact transfer
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "agmmltd-arch/agmm-render-public"
          test "$GITHUB_ACTIONS" = "true"
          gh api "repos/$GITHUB_REPOSITORY" > source-repository.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > source-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > source-artifacts.json
          python3 .github/scripts/f02_preview_export.py validate-source \
            --repository source-repository.json --run source-run.json \
            --jobs source-jobs.json --artifacts source-artifacts.json \
            --out validated-source.json

      - name: Refuse before artifact transfer if hosted disk headroom is insufficient
        shell: bash
        run: python3 .github/scripts/f02_preview_export.py check-capacity --minimum-bytes 12000000000

      - name: Download only the pinned master and review artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ env.SOURCE_MASTER_ARTIFACT_ID }},${{ env.SOURCE_REVIEW_ARTIFACT_ID }}
          path: downloads
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          merge-multiple: false

      - name: Verify exact outputs, checksums, and retained segment lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/f02_preview_export.py prepare \
            --master-dir downloads/F02-PARTIAL-MASTER-4K-37201156544 \
            --review-dir downloads/F02-PARTIAL-REVIEW-1080-37201156544 \
            --source validated-source.json --out-dir preview-export

      - name: Create or verify the unique hash-pinned preview release
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/f02_preview_export.py publish --preview-dir preview-export

      - name: Retain exact export receipt for root metadata adoption
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: F02-PREVIEW-EXPORT-RECEIPT-37201156544
          path: preview-export/HOSTED-PREVIEW.json
          if-no-files-found: error
          retention-days: 7
