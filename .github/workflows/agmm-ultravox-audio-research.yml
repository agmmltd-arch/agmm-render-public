name: Synthetic Ultravox audio research
run-name: Synthetic Ultravox audio research 20261031
on: workflow_dispatch
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare CPU runtime and synthetic test inputs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg cmake libcurl4-openssl-dev
          git clone -q https://github.com/ggml-org/llama.cpp.git llama-src
          cd llama-src
          git checkout --detach 8642541b255bfb5dc39cd351a178be09013a55d6
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build -j 4 --target llama-app
          curl -fL --retry 2 -o model.gguf https://huggingface.co/ggml-org/ultravox-v0_5-llama-3_2-1b-GGUF/resolve/5390c7c41cbd6f261f7f205fc0c5ae61bbdca650/Llama-3.2-1B-Instruct-Q4_K_M.gguf
          curl -fL --retry 2 -o mmproj.gguf https://huggingface.co/ggml-org/ultravox-v0_5-llama-3_2-1b-GGUF/resolve/5390c7c41cbd6f261f7f205fc0c5ae61bbdca650/mmproj-ultravox-v0_5-llama-3_2-1b-f16.gguf
          echo '6f85a640a97cf2bf5b8e764087b1e83da0fdb51d7c9fab7d0fece9385611df83  model.gguf' | sha256sum -c -
          echo 'b34dde1835752949d6b960528269af93c92fec91c61ea0534fcc73f96c1ed8b2  mmproj.gguf' | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/.github/scripts/ultravox-synthetic-audio-panel.py"
          cp research-results.json "$RUNNER_TEMP/research-results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ultravox-synthetic-audio-research-text-only
          path: ${{ runner.temp }}/research-results.json
          if-no-files-found: warn
          retention-days: 7
