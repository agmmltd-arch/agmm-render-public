name: Hail Mary reference mixed vowel timing
run-name: Check voice sounds in all ten rebuilt mixes
on:
  workflow_dispatch:
    inputs:
      proofs: { description: Film to proof run mapping, required: true }
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PROOFS: ${{ inputs.proofs }}
    steps:
      - name: Analyze short excerpts from each hosted mix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python3 -m pip install --quiet 'transformers==4.48.3' 'torch==2.5.1' 'soundfile==0.13.1' 'protobuf' 'sentencepiece' --extra-index-url https://download.pytorch.org/whl/cpu
          espeak-ng -v en-gb -s 150 -w good.wav 'an [[eI aI]] consultancy'
          espeak-ng -v en-gb -s 150 -w bad.wav 'an [[aI aI]] consultancy'
          for f in good bad; do ffmpeg -nostdin -y -v error -i "$f.wav" -ar 16000 -ac 1 "${f}16.wav"; done
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          proofs=json.loads(os.environ['PROOFS']);assert set(proofs)=={'H06'}
          for film,run in sorted(proofs.items()):
              assert re.fullmatch(r'[0-9]+',str(run));folder=pathlib.Path('work')/film;folder.mkdir(parents=True)
              special=film=='H08';artifact='H08-all-voice-proof-not-final' if special else f'voice-proof-{film}-not-final'
              subprocess.run(['gh','run','download',str(run),'-R',os.environ['GITHUB_REPOSITORY'],'-n',artifact,'-D',str(folder)],check=True)
              detail=json.load(open(folder/('all-proof-details.json' if special else 'proof-details.json')))
              items=detail if special else detail['items'];para='P7' if special else 'P6'
              item=next(i for i in items if i['para']==para);assert special or item['status']=='proof inserted'
              source=folder/('H08-VOICE-PROOF.mp4' if special else 'VOICE-PROOF.mp4')
              subprocess.run(['ffmpeg','-nostdin','-y','-v','error','-ss',str(item['start']+5.27),'-t','1.7','-i',str(source),'-vn','-ar','16000','-ac','1',f'{film}.wav'],check=True)
          PY
          python3 - <<'PY'
          import json,soundfile as sf,torch
          from transformers import AutoProcessor,AutoModelForCTC
          name='slplab/wav2vec2-large-robust-L2-english-phoneme-recognition';processor=AutoProcessor.from_pretrained(name);model=AutoModelForCTC.from_pretrained(name).eval()
          for f in ['good16','bad16','H06']:
              audio,sr=sf.read(f+'.wav');inputs=processor(audio,sampling_rate=sr,return_tensors='pt').input_values
              with torch.no_grad(): ids=torch.argmax(model(inputs).logits,dim=-1)
              phones=processor.batch_decode(ids)[0].split();vowels=[p for p in phones if p in ('ey','ay')]
              print(json.dumps({'sample':f,'first_ey_ay':vowels[:3],'opening_phones':phones[:7]}),flush=True)
              if f=='H06':
                  seq=ids[0].tolist();duration=len(audio)/sr;runs=[];start=0
                  for j in range(1,len(seq)+1):
                      if j==len(seq) or seq[j]!=seq[start]:
                          token=processor.tokenizer.convert_ids_to_tokens(seq[start])
                          if token in ('ey','ay','dh','iy','t','f','k'):runs.append({'p':token,'start':round(35.16+start*duration/len(seq),3),'end':round(35.16+j*duration/len(seq),3)})
                          start=j
                  print('REFERENCE_TIMES',json.dumps(runs),flush=True)
          PY
