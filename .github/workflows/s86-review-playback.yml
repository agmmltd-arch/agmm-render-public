name: S86 exact-master review-only playback asset
run-name: S86 exact 1080 review playback (run 37171852324)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: s86-review-playback-37171852324
  cancel-in-progress: false

jobs:
  stage-review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: agmmltd-arch/agmm-render-public
      RENDER_RUN_ID: "37171852324"
      INPUT_ARTIFACT_ID: "11291104171"
      MASTER_ARTIFACT_ID: "11292320586"
      REVIEW_TAG: S86-review-playback-37171852324
      REVIEW_SCRIPT: .github/scripts/stage_s86_review_playback.py
    steps:
      - name: Fail closed to public Linux manual dispatch before release or media access
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_OS" == Linux ]]
          [[ "$GITHUB_REPOSITORY" == "$REPO" ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$RENDER_RUN_ID" == 37171852324 && "$INPUT_ARTIFACT_ID" == 11291104171 ]]
          [[ "$MASTER_ARTIFACT_ID" == 11292320586 && "$REVIEW_TAG" == S86-review-playback-37171852324 ]]

      - name: Check out the exact workflow source on current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read and validate live public run/artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s86-review"
          gh api "repos/$REPO" > "$RUNNER_TEMP/s86-review/repository.json"
          gh api "repos/$REPO/git/ref/heads/main" > "$RUNNER_TEMP/s86-review/main-ref.json"
          gh api "repos/$REPO/actions/runs/$RENDER_RUN_ID" > "$RUNNER_TEMP/s86-review/run.json"
          gh api "repos/$REPO/actions/artifacts/$INPUT_ARTIFACT_ID" > "$RUNNER_TEMP/s86-review/input-artifact.json"
          gh api "repos/$REPO/actions/artifacts/$MASTER_ARTIFACT_ID" > "$RUNNER_TEMP/s86-review/master-artifact.json"
          python3 "$REVIEW_SCRIPT" validate-metadata \
            "$RUNNER_TEMP/s86-review/repository.json" \
            "$RUNNER_TEMP/s86-review/main-ref.json" \
            "$RUNNER_TEMP/s86-review/run.json" \
            "$RUNNER_TEMP/s86-review/input-artifact.json" \
            "$RUNNER_TEMP/s86-review/master-artifact.json" \
            --current-head "$GITHUB_SHA"

      - name: Prove the unique review release tag is absent by exact HTTP 404
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/s86-review/release-tag-response.json" \
            -w '%{http_code}' \
            "https://api.github.com/repos/$REPO/releases/tags/$REVIEW_TAG")
          python3 "$REVIEW_SCRIPT" check-release-absence \
            --http-status "$status" "$RUNNER_TEMP/s86-review/release-tag-response.json"
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > "$RUNNER_TEMP/s86-review/precreate-releases.json"
          python3 "$REVIEW_SCRIPT" check-release-list-absence \
            "$RUNNER_TEMP/s86-review/precreate-releases.json"
          ref_status=$(curl --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/s86-review/tag-ref-response.json" \
            -w '%{http_code}' \
            "https://api.github.com/repos/$REPO/git/ref/tags/$REVIEW_TAG")
          python3 "$REVIEW_SCRIPT" check-tag-ref-absence \
            --http-status "$ref_status" "$RUNNER_TEMP/s86-review/tag-ref-response.json"

      - name: Download exact artifacts only on public Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/$INPUT_ARTIFACT_ID/zip" > "$RUNNER_TEMP/s86-review/input.zip"
          gh api "repos/$REPO/actions/artifacts/$MASTER_ARTIFACT_ID/zip" > "$RUNNER_TEMP/s86-review/masters.zip"

      - name: Verify archive digests and master/input identities; copy 1080 master unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 "$REVIEW_SCRIPT" prepare \
            "$RUNNER_TEMP/s86-review/repository.json" \
            "$RUNNER_TEMP/s86-review/main-ref.json" \
            "$RUNNER_TEMP/s86-review/run.json" \
            "$RUNNER_TEMP/s86-review/input-artifact.json" \
            "$RUNNER_TEMP/s86-review/master-artifact.json" \
            --current-head "$GITHUB_SHA" \
            --input-zip "$RUNNER_TEMP/s86-review/input.zip" \
            --master-zip "$RUNNER_TEMP/s86-review/masters.zip" \
            --out "$RUNNER_TEMP/s86-review/release-assets"

      - name: Create a draft prerelease with the exact master and TEXT-only provenance
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$REVIEW_TAG" \
            "$RUNNER_TEMP/s86-review/release-assets/S86-FINAL-1080.mp4" \
            "$RUNNER_TEMP/s86-review/release-assets/REVIEW-PLAYBACK-RECEIPT.json" \
            "$RUNNER_TEMP/s86-review/release-assets/INPUT-RECEIPT.json" \
            "$RUNNER_TEMP/s86-review/release-assets/TECHNICAL-EVIDENCE.json" \
            "$RUNNER_TEMP/s86-review/release-assets/SHA256SUMS.txt" \
            --repo "$REPO" --target "$GITHUB_SHA" --draft --prerelease \
            --title "S86 exact 1080 master — review playback only" \
            --notes "Exact existing 1080 master from run 37171852324, SHA 9bca09769370e520db8063ae6d70d13482ad5fe58310e6f03cfc4d2369ed3d1c. Review playback only: not Ready, not editorial approval, not release approval, and not a posting asset. No render or transcode."

      - name: Recover the one exact draft by native release ID and verify all staged assets
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > "$RUNNER_TEMP/s86-review/releases.json"
          python3 "$REVIEW_SCRIPT" select-draft "$RUNNER_TEMP/s86-review/releases.json" > "$RUNNER_TEMP/s86-review/release-id.txt"
          release_id=$(cat "$RUNNER_TEMP/s86-review/release-id.txt")
          gh api "repos/$REPO/releases/$release_id" > "$RUNNER_TEMP/s86-review/draft-release.json"
          python3 "$REVIEW_SCRIPT" validate-release \
            "$RUNNER_TEMP/s86-review/draft-release.json" \
            "$RUNNER_TEMP/s86-review/RELEASE-ASSET-INVENTORY.json" --release-id "$release_id"
          printf '%s\n' "$release_id" > "$RUNNER_TEMP/s86-review/verified-release-id.txt"

      - name: Publish the verified prerelease for review playback
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(cat "$RUNNER_TEMP/s86-review/verified-release-id.txt")
          gh api "repos/$REPO/releases/$release_id" -X PATCH -F draft=false > "$RUNNER_TEMP/s86-review/published-release.json"
          gh api "repos/$REPO/releases/$release_id" > "$RUNNER_TEMP/s86-review/published-release.json"
          python3 - "$RUNNER_TEMP/s86-review/published-release.json" "$release_id" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text())
          if d.get("draft") is not False or d.get("prerelease") is not True or d.get("id") != int(sys.argv[2]):
              raise SystemExit("release did not become the exact published prerelease")
          PY

      - name: Verify public byte-range transport on Ubuntu without retaining media
        shell: bash
        run: |
          set -euo pipefail
          python3 "$REVIEW_SCRIPT" finalize-playback "$RUNNER_TEMP/s86-review/release-assets" \
            > "$RUNNER_TEMP/s86-review/transport-result.json"
          release_id=$(cat "$RUNNER_TEMP/s86-review/verified-release-id.txt")
          gh release upload "$REVIEW_TAG" \
            "$RUNNER_TEMP/s86-review/release-assets/PLAYBACK-TRANSPORT-VERIFICATION.json" \
            "$RUNNER_TEMP/s86-review/release-assets/HOSTED-MEDIA-MANIFEST.json" \
            --repo "$REPO"
          gh api "repos/$REPO/releases/$release_id" > "$RUNNER_TEMP/s86-review/final-release.json"
          python3 "$REVIEW_SCRIPT" validate-release \
            "$RUNNER_TEMP/s86-review/final-release.json" \
            "$RUNNER_TEMP/s86-review/FINAL-RELEASE-ASSET-INVENTORY.json" \
            --release-id "$release_id" --published
          cp "$RUNNER_TEMP/s86-review/release-assets/REVIEW-PLAYBACK-RECEIPT.json" "$RUNNER_TEMP/s86-review/"
          cp "$RUNNER_TEMP/s86-review/release-assets/INPUT-RECEIPT.json" "$RUNNER_TEMP/s86-review/"
          cp "$RUNNER_TEMP/s86-review/release-assets/TECHNICAL-EVIDENCE.json" "$RUNNER_TEMP/s86-review/"
          cp "$RUNNER_TEMP/s86-review/release-assets/PLAYBACK-TRANSPORT-VERIFICATION.json" "$RUNNER_TEMP/s86-review/"
          cp "$RUNNER_TEMP/s86-review/release-assets/HOSTED-MEDIA-MANIFEST.json" "$RUNNER_TEMP/s86-review/"

      - name: Upload text-only execution receipt for recovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S86-REVIEW-PLAYBACK-EXECUTION-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s86-review/*.json
            ${{ runner.temp }}/s86-review/RELEASE-ASSET-INVENTORY.json
            ${{ runner.temp }}/s86-review/FINAL-RELEASE-ASSET-INVENTORY.json
          retention-days: 3
          compression-level: 6
          if-no-files-found: warn
