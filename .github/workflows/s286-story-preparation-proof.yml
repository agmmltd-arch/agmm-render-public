name: S286 protected story preparation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d8c0708b6c9a65194d8d4f6c80b5b0bad2bff72c
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: 9c6efdebd8553d4755be74e840a9719d019e0cad
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-story
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: story-extraction/S286-ba7f2b246a85ce6562f53b764304bd01724c8a1e6934ea377d18b46007eac8b9
      - name: Check bound text and prepare protected story prompt
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
          AGMM_WRITER_PASS: ${{ secrets.AGMM_WRITER_PASS }}
          STORY_ba7f2b246a85ce6562f53b764304bd01724c8a1e6934ea377d18b46007eac8b9: ba7f2b246a85ce6562f53b764304bd01724c8a1e6934ea377d18b46007eac8b9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d8c0708b6c9a65194d8d4f6c80b5b0bad2bff72c
          test "$(git -C private-story rev-parse HEAD)" = 9c6efdebd8553d4755be74e840a9719d019e0cad
          test "$(git -C private-story rev-parse HEAD:story-extraction/S286-ba7f2b246a85ce6562f53b764304bd01724c8a1e6934ea377d18b46007eac8b9/MANIFEST.json)" = e21ff97ae1dafde06bd36d00f985cd27aa7e6cca
          python3 .github/scripts/hosted_prepare_story_candidate.py private-story/story-extraction/S286-ba7f2b246a85ce6562f53b764304bd01724c8a1e6934ea377d18b46007eac8b9 "$RUNNER_TEMP/prompt.enc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S286-story-prompt-ENC
          path: ${{ runner.temp }}/prompt.enc
          retention-days: 7
          if-no-files-found: error
