name: Preserve S305 checked voice on Ubuntu
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dc82d4f7ffa92c998b2e5a62441a2d2f82da5be6
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: 4c3997f35128694111bd47be5dcfaa7f20f5f167
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private-pointer
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: timing-proof/S305-ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98/pointer.json
      - name: Verify exact pointer and preserve encrypted hosted voice
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
          AGMM_VOICE_ARCHIVE_DEPLOY_KEY: ${{ secrets.AGMM_VOICE_ARCHIVE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dc82d4f7ffa92c998b2e5a62441a2d2f82da5be6
          test "$(git -C private-pointer rev-parse HEAD)" = 4c3997f35128694111bd47be5dcfaa7f20f5f167
          test "$(git -C private-pointer rev-parse HEAD:timing-proof/S305-ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98/pointer.json)" = 6dfddf403b679fd71895389f92143ea9469b9572
          echo "ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98  private-pointer/timing-proof/S305-ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98/pointer.json" | sha256sum -c >/dev/null
          python3 .github/scripts/hosted_archive_voice.py private-pointer/timing-proof/S305-ee91a95878ca910aa9dce4cec05d265f2f73276c3049c03a95257a452954de98/pointer.json "$RUNNER_TEMP/archive-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S305-voice-archive-receipt
          path: ${{ runner.temp }}/archive-receipt.json
          retention-days: 30
          if-no-files-found: error
