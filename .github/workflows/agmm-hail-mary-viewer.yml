name: Hail Mary temporary private viewer
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PLAYER_SESSION_KEY: ${{ secrets.HAIL_MARY_VIEWER_SESSION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare secure video stream
        run: |
          set -euo pipefail
          gh run download 40723432060 -R "$GITHUB_REPOSITORY" -n Hail-Mary-ten-1080-versions -D phone
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          RUNNER_TRACKING_ID=keep-hail-mary-viewer nohup python3 .github/hail-mary-viewer-server.py > server.log 2>&1 &
          for i in $(seq 1 150); do if test -f viewer.ready; then exit 0; fi; sleep 1; done
          echo 'Viewer failed to start'; exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-viewer-location
          path: viewer.enc
          retention-days: 1
          if-no-files-found: error
      - name: Keep viewer available
        run: sleep 20500
