name: Isolated YouTube schedule original-master duplicate guard proof 20261031
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1f465c86df95ddc3adf607407eb577bd755f9f94
          persist-credentials: false
      - name: Verify candidate source and synthetic behaviour
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1f465c86df95ddc3adf607407eb577bd755f9f94
          for f in youtube_private_inputs.py youtube_studio_cloud_upload.py; do
            test -f ".github/scripts/$f"
          done
          for f in claim_cli.py claim_contract.py claim_store.py github_claim_store.py hosted_queue_cli.py hosted_route.py queue_contract.py decrypt_master.py; do
            test -f ".github/scripts/hosted-youtube-candidate/$f"
          done
          grep -Fx "          ref: 964dfc6d989684389d3331c62de6ae21cb066468" .github/workflows/hosted-youtube-arm-candidate.yml
          cd .github/scripts/hosted-youtube-candidate
          PYTHONPATH=.. python3 -m unittest -q test_claim_cli.py test_youtube_private_inputs.py test_github_claim_store.py test_claim_contract.py test_cli_reconcile.py test_queue_contract.py test_hosted_route.py
          echo 'Synthetic candidate verification only; no provider access or production approval.'
