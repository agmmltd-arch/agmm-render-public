name: Synthetic audio reviewer research
run-name: Synthetic audio reviewer research 20261031
on: workflow_dispatch
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare CPU runtime and synthetic test inputs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg cmake libcurl4-openssl-dev
          git clone -q https://github.com/ggml-org/llama.cpp.git llama-src
          cd llama-src
          git checkout --detach 8642541b255bfb5dc39cd351a178be09013a55d6
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build -j 4 --target llama-app
          curl -fL --retry 2 -o model.gguf https://huggingface.co/LiquidAI/LFM3-Omni-2B-GGUF/resolve/3d29af2ad166f8299c2d820937e47dc0add20ffc/LFM3-Omni-2B-Q4_K_M.gguf
          curl -fL --retry 2 -o mmproj.gguf https://huggingface.co/LiquidAI/LFM3-Omni-2B-GGUF/resolve/3d29af2ad166f8299c2d820937e47dc0add20ffc/mmproj-LFM3-Omni-2B-Q8_0.gguf
          echo '9f8d30e9d4fd7a9349d586e077988229b3ca0a0e4ad730897563d1eccc9893e2  model.gguf' | sha256sum -c -
          echo '8a25f9d1931244429de404fccacfb7fb933970a36aa5688d2f5069f29c6b27b1  mmproj.gguf' | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/.github/scripts/liquid-synthetic-audio-panel.py"
          cp research-results.json "$RUNNER_TEMP/research-results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-audio-research-text-only
          path: ${{ runner.temp }}/research-results.json
          if-no-files-found: warn
          retention-days: 7
