name: AGMM bounded dual-input AV assessment
run-name: dual-av-36-one-shot-20261031
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FLEET_FREE_ONLY: '1'
      AGMM_GEMINI_FREE_PROJECT_ID: gen-lang-client-0105607923
      AGMM_GEMINI_BILLING_DISABLED: 'true'
      AGMM_GEMINI_FREE_TIER: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7f459bf8fbf7732bb879268d1e01b671c2a3159f
          persist-credentials: false
      - name: Verify pinned source and synthetic guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7f459bf8fbf7732bb879268d1e01b671c2a3159f
          cd .github/scripts/dual-av-36
          python3 -B -m unittest test_qualification.py
          python3 -B test_dual_input.py
          command -v ffmpeg && command -v ffprobe
      - name: One bounded blind assessment only
        env:
          AGMM_GEMINI_FREE_REVIEW_KEY: ${{ secrets.AGMM_GEMINI_FREE_REVIEW_KEY }}
        run: |
          set -euo pipefail
          cd .github/scripts/dual-av-36
          python3 -B run_hosted_qualification.py
      - name: Encrypt text-only assessment results
        if: always()
        env:
          AGMM_WRITER_PASS: ${{ secrets.AGMM_WRITER_PASS }}
        run: |
          set -euo pipefail
          cd .github/scripts/dual-av-36
          mkdir -p encrypted
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          from writer_crypto import crypt
          root=Path('qualification-results'); content={}
          if root.exists():
              for p in sorted(root.rglob('*')):
                  if p.is_symlink(): raise RuntimeError('symlink in assessment output')
                  if p.is_file():
                      if p.suffix not in ('.json','.jsonl') or p.stat().st_size>2000000: raise RuntimeError('non-text or oversized assessment output')
                      content[str(p.relative_to(root))]=p.read_text(encoding='utf-8')
          payload=json.dumps({'schema':'dual-av-36-assessment-v1','release_approval':False,'files':content}).encode()
          Path('encrypted/result.enc').write_bytes(crypt(payload,os.environ['AGMM_WRITER_PASS']))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dual-av-36-${{ github.run_id }}
          path: .github/scripts/dual-av-36/encrypted/result.enc
          retention-days: 3
          if-no-files-found: error
