name: F07 reviewed master Studio upload
run-name: F07 public Studio upload from run ${{ inputs.source_run_id }}
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
      master_artifact:
        required: true
      thumbnail_release:
        required: true
      thumbnail_asset:
        required: true
      thumbnail_sha256:
        required: true
      metadata_b64:
        required: true
      metadata_sha256:
        required: true
      approval_b64:
        required: true
      approval_sha256:
        required: true
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_STORAGE_STATE: ${{ secrets.AGMM_YOUTUBE_STORAGE_STATE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          name: ${{ inputs.master_artifact }}
          path: master
      - name: Fetch the exact approved thumbnail
        run: |
          set -euo pipefail
          gh release download '${{ inputs.thumbnail_release }}' -R "$GITHUB_REPOSITORY" -p '${{ inputs.thumbnail_asset }}'
          test "$(sha256sum '${{ inputs.thumbnail_asset }}' | cut -d ' ' -f1)" = '${{ inputs.thumbnail_sha256 }}'
      - name: Verify the reviewed release binding
        run: |
          set -euo pipefail
          printf '%s' '${{ inputs.metadata_b64 }}' | base64 -d > metadata.json
          printf '%s' '${{ inputs.approval_b64 }}' | base64 -d > approval.json
          test "$(sha256sum metadata.json | cut -d ' ' -f1)" = '${{ inputs.metadata_sha256 }}'
          test "$(sha256sum approval.json | cut -d ' ' -f1)" = '${{ inputs.approval_sha256 }}'
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('master/F07-MASTER-4K.mp4'); h=hashlib.sha256()
          with p.open('rb') as f:
              for b in iter(lambda:f.read(8*1024*1024),b''): h.update(b)
          actual=h.hexdigest(); integrity=json.loads(pathlib.Path('master/REMOTE-INTEGRITY.json').read_text())
          recorded=integrity.get('master_4k_sha256') or integrity.get('master_sha256') or (integrity.get('outputs') or {}).get('master_sha256')
          approval=json.loads(pathlib.Path('approval.json').read_text())
          if actual != recorded or approval.get('master_sha256') != actual: raise SystemExit('release binding mismatch')
          if str(approval.get('source_run_id')) != '${{ inputs.source_run_id }}' or approval.get('overall') != 'PASS': raise SystemExit('approval run/verdict mismatch')
          pathlib.Path('master.sha256').write_text(actual+'\n')
          PY
      - name: Install cloud Studio browser
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet playwright pillow
          google-chrome --version
          printf '%s' "$YOUTUBE_STORAGE_STATE" > storage-state.json
          chmod 600 storage-state.json
      - name: Upload through Studio and prove PUBLIC
        run: |
          set -euo pipefail
          .venv/bin/python .github/scripts/youtube_studio_cloud_upload.py \
            --mode publish --storage-state storage-state.json \
            --video master/F07-MASTER-4K.mp4 --thumbnail '${{ inputs.thumbnail_asset }}' \
            --metadata metadata.json --approval approval.json \
            --expected-sha256 "$(cat master.sha256)" --source-run-id '${{ inputs.source_run_id }}' \
            --out receipt/YOUTUBE-PUBLIC.json --evidence evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: F07-YOUTUBE-PUBLIC-${{ inputs.source_run_id }}
          path: |
            receipt/YOUTUBE-PUBLIC.json
            evidence/*.png
            evidence/studio-thumbnail.jpg
          retention-days: 3
          if-no-files-found: warn
      - name: Remove session material
        if: always()
        run: python3 -c 'from pathlib import Path; p=Path("storage-state.json"); p.unlink() if p.exists() else None'
