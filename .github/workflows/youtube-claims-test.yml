name: Synthetic hosted publishing-claim proof
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Run synthetic claim tests and hosted race
        working-directory: .github/scripts/hosted-youtube-candidate
        run: |
          set -euo pipefail
          python3 -m unittest -q test_github_claim_store.py test_claim_contract.py test_queue_contract.py
          python3 test_hosted_claim_race.py
