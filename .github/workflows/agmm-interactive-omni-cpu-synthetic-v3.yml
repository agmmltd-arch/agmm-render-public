name: AGMM synthetic InteractiveOmni CPU research
run-name: AGMM interactive omni cpu synthetic 20261031c
on: workflow_dispatch
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0
          python -m pip install --disable-pip-version-check 'transformers==4.51.3' 'diffusers==0.32.2' 'huggingface-hub[hf_xet]' 'numpy<2' accelerate librosa soundfile decord einops timm onnxruntime omegaconf scipy pillow
      - name: CPU smoke test with synthetic media only
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tempfile, time, traceback
          from huggingface_hub import snapshot_download
          import torch
          from transformers import AutoModel, AutoTokenizer
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and not torch.cuda.is_available()
          print('SYNTHETIC ONLY; no programme input and no release approval', flush=True)
          print('Available memory:', pathlib.Path('/proc/meminfo').read_text().splitlines()[0], flush=True)
          with tempfile.TemporaryDirectory(prefix='interactive-omni-synthetic-') as td:
              base=pathlib.Path(td); modeldir=base/'model'
              snapshot_download('sensenova/InteractiveOmni-4B', revision='2460f0dc81df8527ec18e7e42e04b0031131d76d', local_dir=str(modeldir), ignore_patterns=['*.onnx','*.wav','*.mp4','*.jpg','*.png'])
              p=modeldir/'modeling_interactiveomni.py'; src=p.read_text(); count=src.count('.cuda()'); assert count==4,count
              src=src.replace('.cuda()', '.to(self.device)')
              speech_init='        campplus_path = model.__cache_file(pretrained_model_name_or_path, "campplus.onnx", **kwargs)\n        model.__load_campplus_session(campplus_path)\n        default_wav_path = model.__cache_file(pretrained_model_name_or_path, "taozi.wav", **kwargs)\n        model.default_wav_path = default_wav_path\n        model.default_speaker_embedding = model.extract_speaker_embedding(default_wav_path)'
              assert src.count(speech_init)==1
              src=src.replace(speech_init, '        model.default_speaker_embedding = torch.zeros(1, 192)')
              p.write_text(src)
              import json
              config_path=modeldir/'config.json'; conf=json.loads(config_path.read_text()); assert conf['llm_config']['attn_implementation']=='flash_attention_2'
              conf['llm_config']['attn_implementation']='eager'; conf['vision_config']['use_flash_attn']=False; config_path.write_text(json.dumps(conf))
              print('Nested text and vision attention set to CPU eager in temporary config',flush=True)
              print('Patched four CUDA transfers and skipped unused voice-generation speaker setup for text-only synthetic test; revision pinned',flush=True)
              print('Loading candidate on CPU', flush=True);start=time.time()
              tokenizer=AutoTokenizer.from_pretrained(str(modeldir),trust_remote_code=True,use_fast=True)
              model=AutoModel.from_pretrained(str(modeldir),trust_remote_code=True,torch_dtype=torch.bfloat16,low_cpu_mem_usage=True,attn_implementation='eager').eval()
              print('Loaded in seconds:',round(time.time()-start,1),flush=True)
              audio=base/'voice.wav';video=base/'motion.mp4'
              subprocess.run(['espeak-ng','-s','140','-w',str(audio),'The system offered a time for another service. The team checked before confirming.'],check=True)
              subprocess.run(['ffmpeg','-v','error','-y','-f','lavfi','-i','testsrc2=size=160x90:rate=4:duration=4','-t','4','-c:v','libx264','-pix_fmt','yuv420p',str(video)],check=True)
              msg=[{'role':'user','content':[{'type':'video','video':str(video)},{'type':'audio','audio':str(audio)},{'type':'text','text':'Describe the visible motion and the sound you hear. Do not infer defects.'}]}]
              print('Running one short synthetic audio and video inference',flush=True)
              result=model.chat(tokenizer,{'max_new_tokens':80,'do_sample':False},msg,max_patch_num=1,frame=4,generate_audio=False,print_flag=False)
              print('SYNTHETIC RESPONSE:',str(result)[:5000],flush=True)
              print('SMOKE_ONLY: not an audiovisual review, not a calibration, not release approval',flush=True)
          PY
