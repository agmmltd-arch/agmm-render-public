name: AGMM word check
run-name: AGMM word check ${{ inputs.out_label }}
# The Hail Mary WORD GATE (27 Oct 2026): Whisper large-v3 (no prompt) transcribes every take of the given voice packs, or the mix of a built film, with word probabilities;
# heard words are aligned to the film's script; energy finds silences. Output words.json holds numbers and the heard text of FAILING words only (public repo). Script from the PRIVATE repo.
on:
  workflow_dispatch:
    inputs:
      film: { description: 'film id e.g. H05', required: true }
      private_commit: { description: 'agmm-video-render commit holding the script', required: true }
      script_path: { description: 'path of script.json in that commit', required: true }
      packs: { description: 'JSON [{run,label,pick?,keys?,takes?}] of pool A voice packs', required: false, default: '[]' }
      mix: { description: 'JSON {run,label} of an agmm-hailmary-par run to check the final mix', required: false, default: '' }
      out_label: { description: short label, required: true }
      model: { description: whisper model, required: false, default: 'large-v3' }
permissions:
  contents: read
  actions: read
concurrency:
  group: agmm-word-check-${{ inputs.out_label }}
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/wordcheck
      - name: Fetch the script (read-only deploy key)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            voice-free/wc
            hailmary
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Cache the Whisper weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: wordcheck-${{ inputs.model }}-v1
      - name: Runtime (no apt)
        run: |
          set -euo pipefail
          python -m pip install --quiet --retries 4 faster-whisper==1.2.1 soundfile numpy
          # ffmpeg is only needed to decode an mp4 mix; a packs-only run must not die on a release 404
          if curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"; then
            echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          else echo "no static ffmpeg (packs only)"; fi
      - name: Word check
        env:
          GH_TOKEN: ${{ github.token }}
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
          FILM: ${{ inputs.film }}
          SCRIPT: private/${{ inputs.script_path }}
          PACKS: ${{ inputs.packs }}
          MIX: ${{ inputs.mix }}
          MODEL: ${{ inputs.model }}
          OUT: wc-out
        run: python .github/scripts/wordcheck/wc_job.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wordcheck-${{ inputs.out_label }}
          path: wc-out
          retention-days: 14
