name: F02 hosted subtitle repair check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: f02-subtitle-repair-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify sealed source and scoped repair
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_OS" == Linux && "$GITHUB_REPOSITORY" == agmmltd-arch/agmm-render-public ]]
          gh release download F02-r2c-landscape-4k-202609302152 -p source.tar.gz
          echo '0c91c32f918c9de4c8239f91c1471bd791fc75394a69431a4f362a8d8bf9ddad  source.tar.gz' | sha256sum -c -
          mkdir project
          tar -xzf source.tar.gz -C project
          (cd project && sha256sum -c SHA256SUMS.txt >/dev/null && python3 static_check.py)
          echo 'ee3b1112296d73e05d03edd84577368a83f3cd804395a255b9af3d33277918b2  project/film/sets_b.js' | sha256sum -c -
          echo '9d548b35125934111243f78a6c6baa95d2e931eb219af372994cc8c8b4e5dd1c  repairs/F02/sets_b.js' | sha256sum -c -
          cp repairs/F02/sets_b.js project/film/sets_b.js
          echo 'a3142c43aaeab010ea32daeea432f0fc3612e1c0b3fa50e7c67861571246e619  project/film/film.js' | sha256sum -c -
          echo 'ba768dd9c11f2d322ffe8f6fa274f80e0daa620009515c452cbdf5a365e971c8  repairs/F02/film.js' | sha256sum -c -
          cp repairs/F02/film.js project/film/film.js
          echo '584eed0929c560c72d58122c8fa57af23b24b24e3f58741b7905be3048098323  project/film/film.css' | sha256sum -c -
          echo 'e3a7468c564569230a4efa83fae6edd45fc677a4a5548621f9a18219227cd974  repairs/F02/film.css' | sha256sum -c -
          cp repairs/F02/film.css project/film/film.css
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Freeze verified official-organisation logo on hosted runner only
        run: |
          set -euo pipefail
          gh api orgs/openai > openai-org.json
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,urllib.request,hashlib,struct
          org=json.loads(Path('openai-org.json').read_text())
          url='https://avatars.githubusercontent.com/u/14957082?v=4'
          assert org['html_url']=='https://github.com/openai' and org['blog']=='https://openai.com/' and org['avatar_url']==url
          req=urllib.request.urlopen(url,timeout=30)
          assert req.geturl().startswith('https://avatars.githubusercontent.com/')
          data=req.read(1000001);assert len(data)<=1000000 and data[:8]==b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II',data[16:24]);assert width==height and width>=144
          Path('project/film/img/openai-official.png').write_bytes(data)
          Path('openai-asset-receipt.json').write_text(json.dumps({'source_url':url,'official_org':'https://github.com/openai','verified_domain':'openai.com','sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'width':width,'height':height,'no_redraw':True,'processing_location':'hosted Linux','release_approval':'NOT_GRANTED'},indent=2))
          PYCODE
      - name: Capture actual repaired composition on hosted browser
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory project >/tmp/server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/film/index.html');
            await page.waitForFunction(()=>!!window.__f02Render,{},{timeout:120000});
            await page.evaluate(()=>document.fonts.ready);
            fs.mkdirSync('review/F02-subtitle',{recursive:true});
            for(const t of [36.4,36.5,37.5,39.5,40.4,431.5,439,440,616]){
              await page.evaluate(t=>{window.__F02TL.pause();window.__F02TL.time(t);window.__f02Set(t);window.__f02Set(t);},t);
              await page.waitForTimeout(250);
              await page.screenshot({path:`review/F02-subtitle/frame-${t}.jpg`,type:'jpeg',quality:95});
            }
            if(errors.length)throw new Error(errors.join('\n'));
            fs.copyFileSync('project/film/img/openai-official.png','review/F02-subtitle/openai-official.png');
            fs.copyFileSync('openai-asset-receipt.json','review/F02-subtitle/openai-asset-receipt.json');
            fs.writeFileSync('review/F02-subtitle/receipt.json',JSON.stringify({run_id:process.env.GITHUB_RUN_ID,source_sha256:'0c91c32f918c9de4c8239f91c1471bd791fc75394a69431a4f362a8d8bf9ddad',repair_sha256:'9d548b35125934111243f78a6c6baa95d2e931eb219af372994cc8c8b4e5dd1c',times:[427.56,427.6,429.85,431.16,431.2,431.5,433.55,434.96,435.2,436.35,436.76,439,439.75,440,616],camera_repair_sha256:'ba768dd9c11f2d322ffe8f6fa274f80e0daa620009515c452cbdf5a365e971c8',scope:'targeted source snapshots; not rendered-film/audio approval',release_approval:'NOT_GRANTED'},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Publish native connector evidence
        run: |
          set -euo pipefail
          git config user.name 'AGMM hosted evidence'
          git config user.email 'evidence@users.noreply.github.com'
          git checkout --orphan "review-F02-subtitle-$GITHUB_RUN_ID"
          git rm -rf --cached . >/dev/null
          git add review/F02-subtitle
          git commit -m 'F02 targeted subtitle evidence; NOT release approval'
          git push origin "HEAD:refs/heads/review-F02-subtitle-$GITHUB_RUN_ID"
