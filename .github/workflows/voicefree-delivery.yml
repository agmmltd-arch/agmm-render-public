name: voicefree delivery
run-name: voicefree delivery ${{ inputs.label }}
# p02(a) (voice-free 20 Oct 2026): free voice clone of Sam on CPU with Resemble AI's Chatterbox (MIT code, MIT weights). Paragraph text and Sam's
# reference are read from the PRIVATE repo with the existing read-only deploy key (script text must not enter this public repo or its logs). Output is
# 24 kHz mono PCM16 WAV takes + receipts + word timings, packed and AES-256 encrypted (repo secret VOICEFREE_PASS) because artifacts of a public repo are
# readable by anyone. Weights are cached with actions/cache. No provider call, no paid service.
on:
  workflow_dispatch:
    inputs:
      private_commit:
        description: 40-hex commit of agmm-video-render holding the request and the reference set
        required: true
      request_path:
        description: path of the request JSON inside that commit (voice-free/req/...)
        required: true
      label:
        description: short label
        required: true
permissions:
  contents: read
concurrency:
  group: voicefree-delivery-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  synth:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/voicefree
            .github/scripts/delivery
            .github/scripts/voice-native/shorts/voice/tooling/asr_compare.py
            .github/scripts/voice-native/films/voice/tooling
      - name: Fetch request and Sam's reference (read-only deploy key)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            voice-free
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Cache Chatterbox and Whisper weights, pip wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: voicefree-chatterbox-${{ runner.os }}-v1
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install chatterbox-tts==0.1.7 faster-whisper==1.2.1 soundfile webrtcvad-wheels num2words praat-parselmouth
          python -m pip install --no-deps resemblyzer==0.1.4
          python -m pip freeze | grep -i -E "^(torch|chatterbox|transformers|numpy|librosa|faster|ctranslate2|resemblyzer)" | tr '\n' ' '
      - name: Synthesize (CPU) with delivery control
        run: |
          python .github/scripts/voicefree/synth_delivery.py \
            --request "private/${{ inputs.request_path }}" --private private --out "$RUNNER_TEMP/synth-out" --pub "$RUNNER_TEMP/pub-out"
      - name: Upload numbers-only delivery measurements (no script text)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-${{ inputs.label }}
          path: ${{ runner.temp }}/pub-out
          retention-days: 7
      - name: Encrypt (public repo)
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/scripts/voicefree")
          import vf_common as C
          print("encrypted bytes", C.pack_encrypt(os.environ["RUNNER_TEMP"] + "/synth-out", os.environ["RUNNER_TEMP"] + "/synth-pack.enc"))
          PY
      - name: Upload encrypted pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voicefree-chatterbox-${{ inputs.label }}-ENC
          path: ${{ runner.temp }}/synth-pack.enc
          retention-days: 7
          if-no-files-found: error
