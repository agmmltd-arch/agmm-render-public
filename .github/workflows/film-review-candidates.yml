name: F02 hosted OCR candidate evidence
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: f02-review-candidate-evidence
  cancel-in-progress: false
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Validate exact source before media transfer
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_OS" == Linux && "$GITHUB_REPOSITORY" == agmmltd-arch/agmm-render-public ]]
          gh api repos/agmmltd-arch/agmm-render-public/contents/status/F02-preview.json > content.json
          python3 - <<'PY'
          import base64,json,sys
          from pathlib import Path
          sys.path.insert(0,'.github/scripts')
          from film_review_candidates import proxy_contract
          proof=json.loads(base64.b64decode(json.loads(Path('content.json').read_text())['content']))
          proxy_contract(proof)
          Path('preview-proof.json').write_text(json.dumps(proof))
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: F02-root-hosted-full-20261003-0950-REVIEW-1080
          path: proxy
          run-id: 37114306772
          github-token: ${{ github.token }}
      - name: Extract candidates on hosted runner only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet Pillow==11.3.0
          python3 .github/scripts/film_review_candidates.py
      - name: Publish evidence sample without approval
        run: |
          set -euo pipefail
          TAG="evidence-F02-$GITHUB_RUN_ID"
          gh release create "$TAG" --title "F02 OCR candidate frames - not approval" --notes '21 selected candidate frames from the exact held proxy; not full-frame/audio review or release approval.'
          gh release upload "$TAG" review-evidence/F02-OCR-review-candidates.pdf review-evidence/candidate-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: F02-CANDIDATE-TEXT-RECEIPT
          path: review-evidence/candidate-receipt.json
          retention-days: 7
