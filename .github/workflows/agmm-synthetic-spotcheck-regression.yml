name: AGMM synthetic spotcheck window regression
run-name: AGMM synthetic spotcheck regression 9a66903889c0
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9a66903889c0a51d2edb33a8f04da4bca934b89e
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Exercise exact staged scripts with synthetic audio only
        run: |
          python3 - <<'PY'
          import importlib.util, json, math, pathlib, subprocess, sys, tempfile
          root=pathlib.Path('.github/scripts/voice-native')
          with tempfile.TemporaryDirectory(prefix='synthetic-only-') as td:
            p=pathlib.Path(td); w=p/'SYNTH.wav'
            subprocess.run(['ffmpeg','-v','error','-f','lavfi','-i','sine=frequency=440:duration=0.3:sample_rate=48000','-f','lavfi','-i','anullsrc=r=48000:cl=mono:d=0.15','-filter_complex','[0:a][1:a]concat=n=2:v=0:a=1','-y',str(w)],check=True)
            for kind in ('shorts','films'):
              path=root/kind/'voice/tooling/spotcheck_words.py'; spec=importlib.util.spec_from_file_location('spot',path); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
              tone=mod.rms_db(w,0,.3); mixed=mod.rms_db(w,0,.45); silent=mod.rms_db(w,.3,.15)
              assert -22<tone<-20 and -24<mixed<-22 and silent==-math.inf,(kind,tone,mixed,silent)
              assert mod.rms_db(p/'missing.wav',0,.2) is None and mod.rms_db(w,0,0) is None
              for start,end,expected in [(0,.45,0),(.3,.45,1)]:
                (p/'SYNTH.words.json').write_text(json.dumps({'words':[{'word':'test','start':start,'end':end}]}))
                test=subprocess.run([sys.executable,str(path),str(p),'SYNTH','1'],capture_output=True,text=True)
                assert test.returncode==expected,(kind,test.returncode,test.stdout,test.stderr)
              print(kind, 'PASS synthetic exact windows, missing input and CLI failures')
          PY
