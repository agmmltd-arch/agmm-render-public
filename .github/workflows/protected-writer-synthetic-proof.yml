name: Protected writer transport synthetic proof
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Authenticated synthetic encrypted payload
        required: true
        type: string
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate synthetic input and encrypt synthetic response
        env:
          PAYLOAD: ${{ inputs.payload }}
          AGMM_WRITER_PASS: ${{ secrets.AGMM_WRITER_PASS }}
        run: |
          set -euo pipefail
          mkdir -p sealed
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          exec(base64.b64decode(''))
          incoming=base64.b64decode(os.environ['PAYLOAD'],validate=True)
          assert crypt(incoming,os.environ['AGMM_WRITER_PASS'],True)==b'synthetic writer transport input'
          try:
              crypt(incoming[:-1]+bytes([incoming[-1]^1]),os.environ['AGMM_WRITER_PASS'],True)
          except ValueError:
              pass
          else:
              raise AssertionError('tampered input accepted')
          Path('sealed/result.enc').write_bytes(crypt(b'synthetic writer transport output',os.environ['AGMM_WRITER_PASS']))
          print('Authenticated input and tamper refusal passed; output encrypted')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-writer-synthetic-${{ github.run_id }}
          path: sealed/result.enc
          retention-days: 1
          if-no-files-found: error
