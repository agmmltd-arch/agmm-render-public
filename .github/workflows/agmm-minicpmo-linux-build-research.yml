name: Synthetic MiniCPM Omni Linux guarded build research
run-name: Synthetic MiniCPM Omni Linux guarded build 20261031
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Build exact upstream source only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libcurl4-openssl-dev
          git clone -q https://github.com/OpenBMB/llama.cpp-omni.git source
          cd source
          git checkout --detach a64932ec615e1463158129feaf2f0752d0c07a2e
          test "$(git rev-parse HEAD)" = a64932ec615e1463158129feaf2f0752d0c07a2e
          python3 -c 'from pathlib import Path; p=Path("src/llama-moe-slot.cpp"); s=p.read_text(); a="#ifndef _WIN32\n        std::lock_guard<std::mutex> lock(fd_mutex);\n        for (const auto & kv : fds)"; b="#if defined(F_NOCACHE)\n        std::lock_guard<std::mutex> lock(fd_mutex);\n        for (const auto & kv : fds)"; assert s.count(a)==1; s=s.replace(a,b,1); a="        if (experts_nocache_desired() && fcntl(fd, F_NOCACHE, 1) != 0) {\n            moe_log(\"F_NOCACHE 设置失败: %s\", std::strerror(errno));\n        }"; assert s.count(a)==1; s=s.replace(a,"#if defined(F_NOCACHE)\n"+a+"\n#endif",1); p.write_text(s)'
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF
          cmake --build build -j 4 --target llama-omni-single-test-audio
          build/bin/llama-omni-single-test-audio --help
