name: AGMM short gate
run-name: AGMM short gate ${{ inputs.tag }}

# The 15-check QA gate for one collected short master (qa/gate.py checks 1-10 + kit checks 11-15), run on a hosted macOS
# runner so the operator's Mac does none of the decoding. macOS because check 2 is Apple Vision OCR (kit/tools/ocr_vision,
# compiled here from the bundled ocr_vision.swift and self-tested before it is trusted: its Swift source swallows errors,
# so a broken Vision would otherwise read as "no text on screen" and PASS).
# The bundle (the exact code the Mac would have run, the master and the audio inputs) comes from a release holding exactly
# one asset, gate-bundle.tar.gz, verified against the dispatched SHA256. Check 9 (the critic) needs API keys and is NOT run
# here: GATE_CRITIC=skip makes it an UNJUDGED row and the downscaled copy comes back so the Mac runs the critic on it.
# Mechanical only: it cannot approve, arm, post or publish anything, and it holds no secrets.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag holding exactly one asset, gate-bundle.tar.gz
        required: true
      bundle_sha256:
        description: Exact SHA256 of gate-bundle.tar.gz
        required: true
      tag:
        description: Unique safe label used for run title, concurrency and artifact name
        required: true
      short_id:
        description: Short ID (S67, C13, ...)
        required: true
      round:
        description: Round number (gate/r<N>)
        required: true

permissions:
  contents: read

concurrency:
  group: agmm-short-gate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release }}
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
      TAG: ${{ inputs.tag }}
      SHORT_ID: ${{ inputs.short_id }}
      ROUND: ${{ inputs.round }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - name: Validate labels, download and verify the exact bundle
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/t_start"
          [[ "$RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SHORT_ID" =~ ^[SCP][0-9]{2,3}$ ]]
          [[ "$ROUND" =~ ^[0-9]{1,3}$ ]]
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '[.assets[].name] | sort | join(",")')"
          test "$assets" = "gate-bundle.tar.gz"
          mkdir -p "$RUNNER_TEMP/in"
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p gate-bundle.tar.gz -D "$RUNNER_TEMP/in"
          got="$(shasum -a 256 "$RUNNER_TEMP/in/gate-bundle.tar.gz" | cut -d' ' -f1)"
          test "$got" = "$BUNDLE_SHA256"
          ls -la "$RUNNER_TEMP/in"
      - name: Extract the bundle (names checked, no links, no escapes)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w"
          python3 - <<'PY'
          import os, tarfile
          dest = os.path.join(os.environ["RUNNER_TEMP"], "w")
          tf = tarfile.open(os.path.join(os.environ["RUNNER_TEMP"], "in", "gate-bundle.tar.gz"))
          n = 0
          for m in tf:
              n += 1
              assert n <= 5000, "too many entries"
              assert not m.name.startswith("/") and ".." not in m.name.split("/"), "unsafe path " + m.name
              assert m.isfile() or m.isdir(), "unsupported member " + m.name
              assert m.name.split("/")[0] == "v2", "unexpected root " + m.name
          tf.close()
          tf = tarfile.open(os.path.join(os.environ["RUNNER_TEMP"], "in", "gate-bundle.tar.gz"))
          tf.extractall(dest)
          print("extracted", n, "entries")
          PY
          rm -f "$RUNNER_TEMP/in/gate-bundle.tar.gz"
          du -sh "$RUNNER_TEMP/w"
      - name: Install ffmpeg and the Python libraries
        run: |
          set -euo pipefail
          t0=$(date +%s)
          # ffmpeg 7 on purpose: the Mac that used to run this gate has 7.1, and ffmpeg 9 dropped `-vsync` (check 8's contact sheets) and
          # may move loudness / filter numbers. The gate must judge with the same tools the local gate does.
          brew install ffmpeg@7
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix ffmpeg@7)/bin:$PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy pillow
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "install_s=$(( $(date +%s) - t0 ))" | tee "$RUNNER_TEMP/install.txt"
          ffmpeg -version | head -1
          ffmpeg -version | head -1 | grep -q "version 7\."
      - name: Build Apple Vision OCR and prove it reads text
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/w/v2/kit/tools"
          swiftc -O "$K/ocr_vision.swift" -o "$K/ocr_vision"
          # self-test: a frame with known words must come back through Vision, else this runner cannot be trusted
          # (ocr_vision.swift swallows Vision errors and would print an empty result)
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont
          im = Image.new("RGB", (1080, 300), "white")
          ImageDraw.Draw(im).text((40, 90), "GATE VISION SELFTEST", fill="black",
                                  font=ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial.ttf", 96))
          im.save(os.path.join(os.environ["RUNNER_TEMP"], "vision-selftest.png"))
          PY
          out="$("$K/ocr_vision" "$RUNNER_TEMP/vision-selftest.png")"
          echo "$out"
          echo "$out" | grep -qi "SELFTEST"
      - name: Make the critic's 720p copy first
        run: |
          set -euo pipefail
          # check 9 (the critic) runs on the Mac, which has the API keys. Its input is made and shipped NOW, before the long gate, so the
          # Mac's critic overlaps the gate instead of following it (the critic, not the checks, was most of the wall time).
          python3 - <<'PY'
          import os, shutil, sys
          w = os.path.join(os.environ["RUNNER_TEMP"], "w", "v2")
          sys.path.insert(0, os.path.join(w, "qa"))
          import gate
          sid, rnd = os.environ["SHORT_ID"], os.environ["ROUND"]
          out = os.path.join(w, "kit", "out", sid)
          g = os.path.join(out, "gate", "r" + rnd)
          os.makedirs(g, exist_ok=True)
          ok, err = gate.make_downscaled_copy(os.path.join(out, "FINAL.mp4"), os.path.join(g, "downscaled_for_gemini.mp4"))
          assert ok, err[-400:]
          os.makedirs(os.path.join(os.environ["RUNNER_TEMP"], "ds"), exist_ok=True)
          shutil.copy(os.path.join(g, "downscaled_for_gemini.mp4"), os.path.join(os.environ["RUNNER_TEMP"], "ds"))
          PY
      - name: Ship the critic's copy now
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.tag }}-DS
          path: ${{ runner.temp }}/ds
          retention-days: 1
          if-no-files-found: error
      - name: Run the gate
        env:
          GATE_DS_REUSE: '1'
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cd "$RUNNER_TEMP/w/v2/kit"
          python3 tools/gate_actions_run.py "$SHORT_ID" "$ROUND"
          echo "gate_s=$(( $(date +%s) - t0 ))" | tee "$RUNNER_TEMP/gate.txt"
      - name: Collect the result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          G="$RUNNER_TEMP/w/v2/kit/out/$SHORT_ID/gate/r$ROUND"
          if [ -d "$G" ]; then cp -R "$G"/. "$RUNNER_TEMP/result"/; fi
          cp "$RUNNER_TEMP/install.txt" "$RUNNER_TEMP/gate.txt" "$RUNNER_TEMP/result"/ 2>/dev/null || true
          echo "job_s=$(( $(date +%s) - $(cat "$RUNNER_TEMP/t_start") ))" > "$RUNNER_TEMP/result/job.txt"
          ls -la "$RUNNER_TEMP/result"
      - name: Upload the gate directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.tag }}-GATE
          path: ${{ runner.temp }}/result
          retention-days: 1
          if-no-files-found: error
