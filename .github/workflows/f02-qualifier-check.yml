name: F02 hosted profit qualifier camera check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: f02-profit-qualifier-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify sealed source and scoped repair
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_OS" == Linux && "$GITHUB_REPOSITORY" == agmmltd-arch/agmm-render-public ]]
          gh release download F02-craft-repair-20261003 -p source.tar.gz
          echo '359fe0f4b4b7ec3a3d42ef0fa74dc7db5ad70bd52e9b0724d2c1f97e2f1e057f  source.tar.gz' | sha256sum -c -
          mkdir project
          python3 - <<'PYCODE'
          import pathlib,tarfile
          with tarfile.open('source.tar.gz','r:gz') as tf:
              members=tf.getmembers();root=pathlib.Path('project').resolve()
              assert len(members)<8192 and sum(m.size for m in members)<1024**3
              for m in members:
                  p=(root/m.name).resolve()
                  assert (p==root or root in p.parents) and (m.isfile() or m.isdir()),m.name
              tf.extractall(root,filter='data')
          PYCODE
          (cd project && sha256sum -c SHA256SUMS.txt >/dev/null && python3 static_check.py)
          echo 'ba768dd9c11f2d322ffe8f6fa274f80e0daa620009515c452cbdf5a365e971c8  project/film/film.js' | sha256sum -c -
          echo 'e3a7468c564569230a4efa83fae6edd45fc677a4a5548621f9a18219227cd974  project/film/film.css' | sha256sum -c -
          echo '9d548b35125934111243f78a6c6baa95d2e931eb219af372994cc8c8b4e5dd1c  project/film/sets_b.js' | sha256sum -c -
          echo '6025a4347a8eaed17e31eaebf7834e33ec4af26cc7f59be586ac59ba5157fa1c  project/film/img/openai-official.png' | sha256sum -c -
          echo '5a2e5c70a72092b8b530232a7874a979039fbe8917bf6997f03ce606b660cab8  repairs/F02-qualifier/film.js' | sha256sum -c -
          cp repairs/F02-qualifier/film.js project/film/film.js
          node --check project/film/film.js
          (cd project && python3 static_check.py)
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Capture actual repaired composition on hosted browser
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory project >/tmp/server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/film/index.html');
            await page.waitForFunction(()=>!!window.__f02Render,{},{timeout:120000});
            await page.evaluate(()=>document.fonts.ready);
            fs.mkdirSync('review/F02-qualifier',{recursive:true});
            const times=[436.35,436.4,436.76,437.1,438.24,439,439.25,439.5,439.75,439.8,440,441,442,443.49,443.5];
            for(const t of times){
              await page.evaluate(t=>{window.__F02TL.pause();window.__F02TL.time(t);window.__f02Set(t);window.__f02Set(t);},t);
              await page.waitForTimeout(250);
              await page.screenshot({path:`review/F02-qualifier/frame-${t}.jpg`,type:'jpeg',quality:95});
            }
            if(errors.length)throw new Error(errors.join('\n'));
            fs.copyFileSync('project/film/img/openai-official.png','review/F02-qualifier/openai-official.png');
            fs.writeFileSync('review/F02-qualifier/receipt.json',JSON.stringify({run_id:process.env.GITHUB_RUN_ID,code_commit:process.env.GITHUB_SHA,parent_release:'F02-craft-repair-20261003',parent_package_sha256:'359fe0f4b4b7ec3a3d42ef0fa74dc7db5ad70bd52e9b0724d2c1f97e2f1e057f',parent_film_sha256:'ba768dd9c11f2d322ffe8f6fa274f80e0daa620009515c452cbdf5a365e971c8',camera_repair_sha256:'5a2e5c70a72092b8b530232a7874a979039fbe8917bf6997f03ce606b660cab8',times,scope:'targeted changed-source snapshots, including following wide-camera transition; not rendered-film or audio approval',release_approval:'NOT_GRANTED',media_processing:'HOSTED Linux ONLY'},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Publish native connector evidence
        run: |
          set -euo pipefail
          git config user.name 'AGMM hosted evidence'
          git config user.email 'evidence@users.noreply.github.com'
          git checkout --orphan "review-F02-qualifier-$GITHUB_RUN_ID"
          git rm -rf --cached . >/dev/null
          git add review/F02-qualifier
          git commit -m 'F02 profit qualifier source evidence; NOT release approval'
          git push origin "HEAD:refs/heads/review-F02-qualifier-$GITHUB_RUN_ID"
