name: voicefree fish
run-name: voicefree fish ${{ inputs.label }}
# p02(b) (voice-free 20 Oct 2026): Fish Audio route. Self-hosted on this runner only, never offered as a service (Fish Audio Community License, free
# commercial use while annual revenue is under USD 500,000). The gate job reads the weights' own licence from Hugging Face and refuses CC-BY-NC / Research
# weights and gated weights without a token that Sam's HF account must own; synthesis runs only if the gate allows it. Outputs are encrypted like the
# chatterbox workflow because this repo is public.
on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: Hugging Face repo of the weights
        default: fishaudio/openaudio-s1-mini
        required: true
      private_commit:
        description: 40-hex commit of agmm-video-render holding the request and the reference set
        required: true
      request_path:
        description: path of the request JSON inside that commit
        required: true
      label:
        description: short label
        required: true
permissions:
  contents: read
concurrency:
  group: voicefree-fish-${{ inputs.label }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      allowed: ${{ steps.g.outputs.allowed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/scripts/voicefree
      - id: g
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_FISH }}
        run: |
          set +e
          python3 .github/scripts/voicefree/fish_gate.py "${{ inputs.model_repo }}" "$RUNNER_TEMP/gate.json"
          rc=$?
          if [ $rc -eq 0 ]; then echo "allowed=true" >> "$GITHUB_OUTPUT"; else echo "allowed=false" >> "$GITHUB_OUTPUT"; fi
          { echo '### Fish gate'; echo '```'; cat "$RUNNER_TEMP/gate.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
  synth:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/voicefree
            .github/scripts/voice-native/shorts/voice/tooling/asr_compare.py
      - name: Fetch request and Sam's reference (read-only deploy key)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            voice-free
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Cache Fish weights, Whisper, pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: voicefree-fish-${{ runner.os }}-${{ inputs.model_repo }}-v1
      - name: Install runtime (fish-speech from source, CPU torch)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_FISH }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 portaudio19-dev
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/fishaudio/fish-speech.git@v1.5.1" faster-whisper==1.2.1 soundfile webrtcvad-wheels huggingface_hub
          python -m pip install --no-deps resemblyzer==0.1.4
          huggingface-cli download "${{ inputs.model_repo }}" --local-dir "$RUNNER_TEMP/fish-ckpt"
      - name: Synthesize (CPU)
        run: |
          python .github/scripts/voicefree/synth.py --engine fish \
            --request "private/${{ inputs.request_path }}" --private private --out "$RUNNER_TEMP/synth-out"
        env:
          FISH_CKPT: ${{ runner.temp }}/fish-ckpt
      - name: Encrypt (public repo)
        env:
          VOICEFREE_PASS: ${{ secrets.VOICEFREE_PASS }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/scripts/voicefree")
          import vf_common as C
          print("encrypted bytes", C.pack_encrypt(os.environ["RUNNER_TEMP"] + "/synth-out", os.environ["RUNNER_TEMP"] + "/synth-pack.enc"))
          PY
      - name: Upload encrypted pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voicefree-fish-${{ inputs.label }}-ENC
          path: ${{ runner.temp }}/synth-pack.enc
          retention-days: 7
          if-no-files-found: error
