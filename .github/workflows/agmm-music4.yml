name: AGMM music v3
run-name: AGMM music ${{ inputs.label }}
# Hail Mary music supervision (27 Oct 2026): demucs the 8 reference reels (story half), CLAP-embed their non-vocal stems,
# download the Openverse CC0/PDM candidates listed in the private commit, score them (CLAP audio-to-audio, text mood, tempo,
# vocal probability, noise floor, clipping, loopability), export the winners as mp3. Media only from the PRIVATE repo / Openverse; nothing decodes on the Mac.
on:
  workflow_dispatch:
    inputs:
      private_commit: { description: 40-hex commit of agmm-video-render holding hailmary/music and hailmary/soundref, required: true }
      label: { description: short label, required: true }
      script: { description: script name inside hailmary/music, required: false, default: music4.py }
permissions:
  contents: read
concurrency:
  group: agmm-music4-${{ inputs.label }}-${{ matrix.shard }}
  cancel-in-progress: false
jobs:
  score:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    if: github.repository == 'agmmltd-arch/agmm-render-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agmmltd-arch/agmm-video-render
          ref: ${{ inputs.private_commit }}
          ssh-key: ${{ secrets.AGMM_SFX_READ_DEPLOY_KEY }}
          path: private
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            hailmary/soundref
            hailmary/music4
      - name: Runtime (static ffmpeg, no apt)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - name: Python deps
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet --retries 4 "numpy<2" scipy soundfile pyloudnorm "librosa==0.10.2.post1"
          pip install --quiet --retries 4 torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet --retries 4 panns-inference || true
          pip install --quiet --retries 4 demucs==4.0.1 "transformers==4.46.3" "numpy<2"
          python -c "import torch,demucs,transformers,librosa;print(torch.__version__,transformers.__version__,librosa.__version__)"
      - name: Essentia TF
        continue-on-error: true
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet --retries 4 essentia-tensorflow "numpy<2" || true
          python -c "import essentia.standard as es; print('essentia', es.__file__)"
      - name: PANNs checkpoint
        continue-on-error: true
        run: |
          mkdir -p ~/panns_data
          curl -fL --retry 5 --retry-delay 5 -o ~/panns_data/Cnn14_mAP=0.431.pth "https://zenodo.org/record/3987831/files/Cnn14_mAP%3D0.431.pth?download=1"
          curl -fL --retry 5 -o ~/panns_data/class_labels_indices.csv "http://storage.googleapis.com/us_audioset/youtube_corpus/v1/csv/class_labels_indices.csv"
          ls -la ~/panns_data
      - name: Score
        env:
          SHARD: ${{ matrix.shard }}
          NSHARD: '5'
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/venv/bin/activate"
          mkdir -p out
          python private/hailmary/music4/${{ inputs.script }} out private/hailmary/soundref private/hailmary/music4 2>&1 | grep -v -i warning | tee out/log.txt | tail -250
          ls -la out out/export | head -20
      - name: Encrypt the audio pack
        if: always()
        run: |
          set -euo pipefail
          cat > pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqkFPrJjqJEb8aRKQCUZG
          G9908H5tfI3FuTNjQzprgrCEfNyHzzh0reo7keyAi5NLSTnfoRmojenngewXWENm
          oogYZOSBMmXIDW9X4tnL0a2f7j0xupfggb1opInG+5WhV4BeLCnWXlRSFyV8f7DX
          H024Vb49I/xZszBGR3rF9zIgZN0gntf633q/nYCHuM6DyPHG0FAvfm7qtx7b7cy9
          lfsT7IdLZLPpvD7CvnzHCyxQZgVr5LStB1HM2OK4jst7KvlfWzsQ6wfvcUePYSWx
          VD0sj2OOZHzRB1xqUVzQ7ttFmrQ0JcDCzB5q5hQF58QMAZ/gD+zocUVbbfCUGSaE
          eqVkr9iYF3gjV74iOu38+TExh9t5e1GfWeKbn9x2mUepWsnorIJ68M/aNFmh8Wmu
          OI/BfdT8T0dCIYxPwlOJfqd2L177xLUuQiY6NU/h9WnBl4sHjT/8sPpvIXcELE4p
          HRog9J28wHncIk0PsCTMPBDX1ZgcCMe+SJ8KsDK0Tb1vAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          mkdir -p pack
          head -c 32 /dev/urandom | base64 > key.txt
          tar -C out -cz export | openssl enc -aes-256-cbc -pbkdf2 -pass file:key.txt -out pack/audio.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in key.txt -out pack/key.rsa
          rm -rf out/export key.txt
          ls -la pack out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: music4-${{ inputs.label }}-${{ matrix.shard }}
          path: |
            out
            pack
          retention-days: 3
