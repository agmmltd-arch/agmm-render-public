name: F07 hosted sealed-source text inventory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      F07_RELEASE_TAG: F07-r4-actions-full-landscape-4k-20260930194517
      F07_RELEASE_ASSET_ID: "601625680"
      F07_PACKAGE_SHA256: 10394b58dad8f1e6131486edb2d9d310b82a923fef2ca6aea50f229cb165bfd7
      F07_PACKAGE_BYTES: "43650580"
      F07_EXPECTED_REPOSITORY: agmmltd-arch/agmm-render-public

    steps:
      - name: Check out workflow and text-only inventory helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Confirm the workflow runs in the expected public repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$F07_EXPECTED_REPOSITORY"
          gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '{full_name,private,visibility}' \
            > "$RUNNER_TEMP/f07-repository.json"
          python3 .github/scripts/f07_hosted_source_inventory.py check-repository \
            --metadata "$RUNNER_TEMP/f07-repository.json" \
            --expected-repository "$F07_EXPECTED_REPOSITORY"

      - name: Confirm the immutable release asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${F07_RELEASE_TAG}" \
            --jq "[.assets[] | select(.id == (${F07_RELEASE_ASSET_ID}|tonumber)) | {id,name,size,digest,state}]" \
            > "$RUNNER_TEMP/f07-release-asset.json"
          python3 .github/scripts/f07_hosted_source_inventory.py check-release \
            --metadata "$RUNNER_TEMP/f07-release-asset.json" \
            --asset-id "$F07_RELEASE_ASSET_ID" \
            --asset-name source.tar.gz \
            --size "$F07_PACKAGE_BYTES" \
            --sha256 "$F07_PACKAGE_SHA256"

      - name: Download and authenticate the sealed source archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f07-parent"
          gh release download "$F07_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern source.tar.gz \
            --dir "$RUNNER_TEMP/f07-parent"
          printf '%s  %s\n' "$F07_PACKAGE_SHA256" "$RUNNER_TEMP/f07-parent/source.tar.gz" \
            | sha256sum --check --status

      - name: Extract only the four source-text files and create the inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/f07_hosted_source_inventory.py inventory \
            --archive "$RUNNER_TEMP/f07-parent/source.tar.gz" \
            --expected-sha256 "$F07_PACKAGE_SHA256" \
            --release-tag "$F07_RELEASE_TAG" \
            --output "$RUNNER_TEMP/f07-inventory"

      - name: Publish only source text and its inventory to a new review branch
        shell: bash
        run: |
          set -euo pipefail
          branch="review/f07-source-inventory-${GITHUB_RUN_ID}"
          if git ls-remote --heads origin "refs/heads/${branch}" | grep -q .; then
            echo "Review branch already exists; refusing to replace it."
            exit 1
          fi

          git switch --orphan "$branch"
          git clean -fdx
          mkdir -p source/film
          cp "$RUNNER_TEMP/f07-inventory/source/film.js" source/film/film.js
          cp "$RUNNER_TEMP/f07-inventory/source/words.js" source/film/words.js
          cp "$RUNNER_TEMP/f07-inventory/source/film.css" source/film/film.css
          cp "$RUNNER_TEMP/f07-inventory/source/sets_studio.js" source/film/sets_studio.js
          cp "$RUNNER_TEMP/f07-inventory/inventory.json" inventory.json

          git add -- source/film/film.js source/film/words.js source/film/film.css \
            source/film/sets_studio.js inventory.json
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' inventory.json source/film/film.css source/film/film.js \
            source/film/sets_studio.js source/film/words.js | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Inventory sealed F07 source text"
          tree="$(git ls-tree -r --name-only HEAD | LC_ALL=C sort)"
          test "$tree" = "$expected"
          git push origin "HEAD:refs/heads/${branch}"
